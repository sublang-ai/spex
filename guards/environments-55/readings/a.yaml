# Remembers whose copy the last install left at the path.
# Three independent Drafters each wrote this same reading from the items
# and the declaration alone.
format: 1
state:
  standing: { type: package?, start: null }
events:
  install:
    then:
      standing: "effect.placed"
assertion:
  - on: install
    when: "standing in selected and standing in providing"
    shall: "effect.placed == none or effect.placed == standing"
