  }

  function renderSteps(s, key, stepsId, inst) {
    const wrap = h('div', { class: 'steps', id: stepsId });
    if (s.stepKind === 'none' || !s.steps.length) {
      wrap.append(h('div', { class: 'steps-none', text: 'No steps detected' }));
      return wrap;
    }
    const noun = s.stepKind === 'section' ? 'Sections' : 'Steps';
    wrap.append(h('div', { class: 'steps-head', text: `${noun} · ${s.steps.length}` }));
    for (const st of s.steps) {
      const open = state.openSteps.has(st.id);
      const bodyId = 'sb-' + (++uid);
      const stepCats = rollupIds(new Set(st.tags.map((t) => t.id)), state.idx.tagById);
      const row = h('div', { class: 'step' + (open ? ' open' : ''), 'data-step': st.id });
      const line = h('div', { class: 'step-line' });
      line.append(h('button', { type: 'button', class: 'step-main', 'data-act': 'step', 'data-step': st.id, 'data-fk': `step|${key}|${st.id}`, 'aria-expanded': String(open), 'aria-controls': open ? bodyId : null },
        h('span', { class: 'step-idx', text: String(st.index) }),
        h('span', { class: 'step-title', title: st.title, text: st.title }),
        h('span', { class: 'step-tags' }, pillsFor(stepCats, { bare: true }))));
      if (st.calls.length) {
        const calls = h('span', { class: 'step-calls' });
        for (const to of st.calls) {
          const target = state.idx.byId.get(to);
          if (target) {
            const kind = state.idx.stepEdgeKind.get(st.id + '\u0000' + to) || 'calls';
            calls.append(h('button', { type: 'button', class: 'call-chip' + (kind === 'mentions' ? ' mention' : ''), 'data-act': 'follow', 'data-to': to, 'data-fk': `cc|${key}|${st.id}|${to}`, title: `${kind === 'mentions' ? 'Mentions' : 'Calls'} /${target.name} — go there` }, `→ ${target.name}`));
          } else {
            calls.append(h('span', { class: 'call-chip unresolved', title: `${to} is not installed` }, `→ ${to}`));
          }
        }
        line.append(calls);
      }
      row.append(line);
      if (open) row.append(renderStepBody(st, bodyId));
      wrap.append(row);
      inst.steps.set(st.id, line);
    }
    return wrap;
  }

  function renderStepBody(st, bodyId) {
    const body = h('div', { class: 'step-body', id: bodyId });
    if (st.line) body.append(h('div', { class: 'lines', text: st.endLine && st.endLine !== st.line ? `Lines ${st.line}–${st.endLine}` : `Line ${st.line}` }));
    if (st.excerpt) body.append(h('p', { class: 'excerpt', text: st.excerpt }));
    for (const t of st.tags) body.append(renderTagEvidence(t));
    if (!st.excerpt && !st.tags.length) body.append(h('span', { class: 'muted', text: 'No text or tags in this step.' }));
    return body;
  }

  function renderTagEvidence(t) {
    const c = CATS.includes(t.category) ? t.category : catOf(t.id);
    return h('div', { class: 'ev-tag' },
      h('span', null, h('span', { class: `tagchip cat-${c}`, title: state.view.categories[c].label }, icon(c), str(t.label) || tagLabel(t.id)),
        t.source && t.source !== 'rule' ? h('span', { class: 'src-badge', text: ` from ${t.source}` }) : null),
      t.evidence.length ? h('ul', { class: 'ev' }, t.evidence.map((e) => h('li', null, h('span', { class: 'ln', text: e.line ? `L${e.line}` : '' }), h('span', { class: 'tx', text: str(e.text) })))) : null);
  }

  // ===================================================================
  // Links overlay
  // ===================================================================
  let linkEls = [];
  const elIds = new WeakMap();
  let elSeq = 0;
  const elId = (el) => { let v = elIds.get(el); if (!v) { v = ++elSeq; elIds.set(el, v); } return v; };

  function drawLinks() {
    const layer = els.layer;
    layer.replaceChildren();
    linkEls = [];
    const board = els.board;
    els.svg.setAttribute('width', board.scrollWidth);
    els.svg.setAttribute('height', board.scrollHeight);
    if (!anchors.size) return;
    const bRect = board.getBoundingClientRect();
    const rects = new Map();
    const rectOf = (el) => {
      let r = rects.get(el);
      if (!r) {
        const c = el.getBoundingClientRect();
        r = { l: c.left - bRect.left, r: c.right - bRect.left, t: c.top - bRect.top, b: c.bottom - bRect.top, cy: c.top - bRect.top + Math.min(c.height / 2, 18) };
        rects.set(el, r);
      }
      return r;
    };
    const agg = new Map();
    for (const e of state.derived.shown) {
      if (e.from === e.to || !isVisible(e.from) || !isVisible(e.to)) continue;
      const srcs = anchors.get(e.from), tgts = anchors.get(e.to);
      if (!srcs || !tgts) continue;
      let best = null, bestD = Infinity;
      for (const s of srcs) {
        const sEl = !s.group && e.fromStep && state.expanded.has(e.from) && s.steps.get(e.fromStep) ? s.steps.get(e.fromStep) : s.el;
        const a = rectOf(sEl);
        for (const t of tgts) {
          if (t.el === s.el) continue;
          const b = rectOf(t.el);
          const dist = Math.abs((a.l + a.r) / 2 - (b.l + b.r) / 2) + Math.abs(a.cy - b.cy) * 0.35 + (b.l < a.l ? 40 : 0);
          if (dist < bestD) { bestD = dist; best = { sEl, tEl: t.el }; }
        }
      }
      if (!best || best.sEl === best.tEl) continue;
      const k = elId(best.sEl) + '>' + elId(best.tEl) + ':' + e.kind;
      let L = agg.get(k);
      if (!L) { L = { sEl: best.sEl, tEl: best.tEl, kind: e.kind, n: 0, skills: new Set() }; agg.set(k, L); }
      L.n++;
      L.skills.add(e.from); L.skills.add(e.to);
    }
    const NS = 'http://www.w3.org/2000/svg';
    const frag = document.createDocumentFragment();
    // Mentions first so calls paint on top.
    const list = [...agg.values()].sort((x, y) => (x.kind === y.kind ? 0 : x.kind === 'mentions' ? -1 : 1));
    // Pick the side each end attaches to, then spread the ends sharing one side of one element
    // ("ports") down that side in the order of their other ends, so parallel links stay apart.
    const ports = new Map();
    const port = (el, side, L, end, otherY) => {
      const k = elId(el) + side;
      if (!ports.has(k)) ports.set(k, { el, list: [] });
      ports.get(k).list.push({ L, end, otherY });
    };
    for (const L of list) {
      const a = rectOf(L.sEl), b = rectOf(L.tEl);
      if (b.l >= a.r + 6) L.dir = 'r'; else if (b.r <= a.l - 6) L.dir = 'l'; else L.dir = 's';
      L.y1 = a.cy; L.y2 = b.cy;
      port(L.sEl, L.dir === 'l' ? 'l' : 'r', L, 's', b.cy);
      port(L.tEl, L.dir === 'r' ? 'l' : 'r', L, 't', a.cy);
    }
    for (const { el, list: ends } of ports.values()) {
      if (ends.length < 2) continue;
      const r = rectOf(el);
      const top = r.t + 8, span = Math.min(r.b - r.t, 72) - 16;
      if (span < 12) continue;
      ends.sort((x, y) => x.otherY - y.otherY);
      ends.forEach((e, k) => { const y = top + (span * (k + 1)) / (ends.length + 1); if (e.end === 's') e.L.y1 = y; else e.L.y2 = y; });
    }
    let skipN = 0;
    for (const L of list) {
      const a = rectOf(L.sEl), b = rectOf(L.tEl);
      const y1 = L.y1, y2 = L.y2;
      let x1, x2, d, mx;
      // Between collapsed groups that skip a column, dip under the row of group cards so the
      // link can't be mistaken for one ending at the card it would otherwise pass beneath.
      const skip = L.sEl.classList.contains('group-card') && L.tEl.classList.contains('group-card') && Math.abs((a.l + a.r) / 2 - (b.l + b.r) / 2) > (a.r - a.l) * 1.6;
      const dip = skip ? Math.max(a.b, b.b) + 26 + (skipN++ % 5) * 7 : 0;
      if (L.dir === 'r') {
        x1 = a.r; x2 = b.l - 1;
        const dx = Math.max(24, (x2 - x1) * 0.45);
        d = skip ? `M${x1} ${y1} C${x1 + 40} ${y1} ${x1 + 20} ${dip} ${x1 + 60} ${dip} L${x2 - 60} ${dip} C${x2 - 20} ${dip} ${x2 - 40} ${y2} ${x2} ${y2}`
          : `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
        mx = x2 - 20;
      } else if (L.dir === 'l') {
        x1 = a.l; x2 = b.r + 1;
        const dx = Math.max(24, (x1 - x2) * 0.45);
        d = skip ? `M${x1} ${y1} C${x1 - 40} ${y1} ${x1 - 20} ${dip} ${x1 - 60} ${dip} L${x2 + 60} ${dip} C${x2 + 20} ${dip} ${x2 + 40} ${y2} ${x2} ${y2}`
          : `M${x1} ${y1} C${x1 - dx} ${y1} ${x2 + dx} ${y2} ${x2} ${y2}`;
        mx = x2 + 20;
      } else {
        // Same column: bow out into the gutter on the right.
        x1 = a.r; x2 = b.r + 1;
        const bow = 16 + Math.min(14, Math.abs(y2 - y1) * 0.04);
        d = `M${x1} ${y1} C${x1 + bow} ${y1} ${x2 + bow} ${y2} ${x2} ${y2}`;
        mx = x2 + 14;
      }
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'lk ' + L.kind);
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('class', 'ln');
      p.setAttribute('d', d);
      g.append(p);
      if (L.n > 1) {
        // The count sits in the gutter just before the target, where links to one target converge.
        const my = L.dir === 's' ? (y1 + y2) / 2 : y2;
        const label = document.createElementNS(NS, 'g');
        label.setAttribute('class', 'cnt');
        const txt = '×' + L.n, w = 8 + txt.length * 6;
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', mx - w / 2); r.setAttribute('y', my - 8); r.setAttribute('width', w); r.setAttribute('height', 16); r.setAttribute('rx', 8);
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', mx); t.setAttribute('y', my + 3.5); t.setAttribute('text-anchor', 'middle');
        t.textContent = txt;
        label.append(r, t);
        g.append(label);
      }
      frag.append(g);
      linkEls.push({ el: g, skills: L.skills });
    }
    layer.append(frag);
    applyEmphasis();
  }

  // ===================================================================
  // Selection and emphasis (class toggles only; no re-render)
  // ===================================================================
  let markedCards = [];
  function activeSet() {
    if (state.hover) return new Set([state.hover]);
    const sel = state.selection;
    if (sel && sel.type === 'skill') return new Set([sel.id]);
    if (sel && sel.type === 'phase') { const p = findPhase(sel.id); return p ? new Set(p.skills) : null; }
    if (state.highlight.size) return state.highlight;
    return null;
  }
  function applyEmphasis() {
    const act = activeSet();
    els.svg.classList.toggle('emph', !!act && linkEls.length > 0);
    for (const L of linkEls) {
      let hot = false;
      if (act) for (const id of L.skills) if (act.has(id)) { hot = true; break; }
      L.el.classList.toggle('hot', hot);
    }
    for (const el of markedCards) el.classList.remove('nb');
    markedCards = [];
    if (act && act.size === 1) {
      const [id] = act;
      const nb = new Set([...(state.derived.out.get(id) || []), ...(state.derived.inc.get(id) || [])]);
      for (const n of nb) for (const inst of anchors.get(n) || []) if (!inst.group) { inst.card.classList.add('nb'); markedCards.push(inst.card); }
    }
  }
  function syncSelection() {
    const sel = state.selection;
    for (const el of els.board.querySelectorAll('.card.selected, .card.hl, .col.selected')) el.classList.remove('selected', 'hl');
    if (sel && sel.type === 'skill') for (const inst of anchors.get(sel.id) || []) if (!inst.group) inst.card.classList.add('selected');
    if (sel && sel.type === 'phase') { const col = els.board.querySelector(`.col[data-phase="${CSS.escape(sel.id)}"]`); if (col) col.classList.add('selected'); }
    for (const id of state.highlight) for (const inst of anchors.get(id) || []) if (!inst.group) inst.card.classList.add('hl');
    applyEmphasis();
  }

  function select(sel, opts = {}) {
    state.selection = sel;
    if (!opts.keepHighlight) state.highlight = new Set();
    if (sel) state.detailsOpen = true;
    savePrefs();
    invalidate('chrome', 'details', 'links');
  }

  // Follow a link: reveal the target (clear filters, expand its group), select, scroll, flash.
  function follow(id, opts = {}) {
    const idx = state.idx;
    if (!idx.byId.has(id)) return;
    if (!isVisible(id)) {
      setSearch(''); state.tagFilter.clear(); state.focus = null; recompute();
      toast(`Cleared filters to show ${skillLabel(id)}`);
    }
    if (state.grouping === 'workflow' && !activeWorkflow()) state.grouping = 'links';
    const groups = computeGroups() || [];
    const containing = groups.filter((g) => g.ids.includes(id));
    if (containing.length && containing.every((g) => state.collapsed.has(groupKey(g)))) state.collapsed.delete(groupKey(containing[0]));
    if (opts.expand) state.expanded.add(id);
    if (opts.openStep) state.openSteps.add(opts.openStep);
    state.selection = { type: 'skill', id };
    if (!opts.keepHighlight) state.highlight = new Set();
    state.detailsOpen = true;
    savePrefs();
    invalidate('chrome', 'canvas', 'details');
    flush();
    const inst = (anchors.get(id) || []).find((x) => !x.group);
    if (!inst) return;
    const target = opts.openStep && inst.steps.get(opts.openStep) ? inst.steps.get(opts.openStep) : inst.card;
    target.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
    inst.card.classList.remove('flash');
    void inst.card.offsetWidth;
    inst.card.classList.add('flash');
    setTimeout(() => inst.card.classList.remove('flash'), 1400);
    if (opts.focusCard) inst.card.querySelector('.card-main')?.focus({ preventScroll: true });
  }

  // ===================================================================
  // Details panel
  // ===================================================================
  function renderDetails() {
    const panel = els.details;
    const scrollTop = panel.scrollTop;
    const prevSel = panel.dataset.sel || '';
    const sel = state.selection;
    const selKey = sel ? sel.type + ':' + sel.id : '';
    let content;
    if (sel && sel.type === 'skill' && state.idx.byId.has(sel.id)) content = renderSkillDetails(state.idx.byId.get(sel.id));
    else if (sel && sel.type === 'phase' && findPhase(sel.id)) content = renderPhaseDetails(findPhase(sel.id));
    else content = renderDetailsEmpty();
    panel.replaceChildren(...content);
    panel.dataset.sel = selKey;
    panel.scrollTop = prevSel === selKey ? scrollTop : 0;
  }

  function detailsHead(kicker, title, mono) {
    return h('div', { class: 'd-head' },
      h('div', { style: 'flex:1;min-width:0' }, h('div', { class: 'd-kicker', text: kicker }), h('h2', { class: mono ? 'mono' : null, tabindex: '-1', text: title })),
      h('button', { type: 'button', class: 'icon-btn', 'data-act': 'close-details', 'aria-label': 'Close details', title: 'Close (Esc clears the selection)' }, icon('x')));
  }
  const sec = (title, ...kids) => h('section', { class: 'd-sec' }, h('h3', null, title), ...kids);

  function renderDetailsEmpty() {
    const cats = state.view.categories;
    return [
      detailsHead('Details', 'Nothing selected'),
      h('div', { class: 'd-body' },
        h('p', { class: 'd-desc', style: 'color:var(--text-2)', text: 'Select a skill to see its steps, tags and links. Select a phase name to see what flows through it.' }),
        sec('Legend', h('div', { class: 'legend' },
          CATS.map((c) => h('div', { class: 'row' }, h('span', { class: `pill cat-${c}` }, icon(c), '2'), h('span', { text: cats[c].label }))),
          h('div', { class: 'row' }, legendLine(false), h('span', { text: 'Calls — one skill runs another' })),
          h('div', { class: 'row' }, legendLine(true), h('span', { text: 'Mentions — named without running it' })),
          h('div', { class: 'row' }, h('span', { class: 'issue-dot' }), h('span', { text: 'Has an issue worth a look' })))),

  let pop = null;
  function openPopover(anchor, content, cls) {

  // Keeps the popover beside its anchor; closes it once the anchor scrolls out of the canvas.
  function positionPopover() {

    const r = anchor.getBoundingClientRect();
    if (els.board.contains(anchor)) {
      const c = els.canvas.getBoundingClientRect();
      if (!anchor.isConnected || r.bottom < c.top || r.top > c.bottom || r.right < c.left || r.left > c.right) { closePopover(false); return; }
    }
    const w = el.offsetWidth, ht = el.offsetHeight;
    const left = Math.min(r.left, window.innerWidth - w - 8);
    let top = r.bottom + 4;
    if (top + ht > window.innerHeight - 8 && r.top - ht - 4 > 8) top = r.top - ht - 4;

    el.style.top = Math.max(8, top) + 'px';

  function modal(titleText, bodyKids, buttons, opts = {}) {
    return new Promise((resolve) => {
      const opener = document.activeElement;
      const tid = 'dlg-t-' + (++uid);
      const dlg = h('dialog', { class: 'dlg' + (opts.wide ? ' wide' : ''), 'aria-labelledby': tid });
      const form = h('form', { class: 'dlg-form', novalidate: true });
      let done = false;
      const finish = (v) => {
        if (done) return;

        dlg.close();

        const back = opts.returnFocus ? opts.returnFocus() : opener;
        if (back && back.isConnected) back.focus({ preventScroll: true });
        resolve(v);

      form.append(h('div', { class: 'dlg-head' }, h('h2', { id: tid, text: titleText }),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onclick: () => finish(null) }, icon('x'))));
      form.append(h('div', { class: 'dlg-body' }, bodyKids));
      if (buttons.length) {

        for (const b of buttons) foot.append(h('button', { type: b.primary ? 'submit' : 'button', class: 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), onclick: b.primary ? null : () => finish(b.value) }, b.label));
        form.append(foot);
      }
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = opts.onSubmit ? opts.onSubmit() : (buttons.find((b) => b.primary) || {}).value;
        if (v !== undefined) finish(v);
      });
      dlg.addEventListener('cancel', (e) => { e.preventDefault(); finish(null); });
      dlg.append(form);
      document.body.append(dlg);
      dlg.showModal();
      const f = opts.initialFocus ? opts.initialFocus(form) : form.querySelector('input, textarea, .dlg-foot .primary');
      if (f) f.focus();
      if (opts.onOpen) opts.onOpen(form);
    });

    const p = modal(`/${s.name} · ${path}`, [pre], [], { wide: true, initialFocus: () => pre });

      const res = await fetch(`/api/file?skill=${encodeURIComponent(skillId)}&path=${encodeURIComponent(path)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      pre.textContent = await res.text();
    } catch (err) {
      pre.textContent = `Couldn’t read ${path}${err && err.message ? ` (${err.message})` : ''}.`;
    }
    return p;
  }

  // Undo applies only while its edit is the latest: any later edit dismisses every Undo toast.
  let undoToasts = [];
  let focusBeforeToasts = null;
  function dismissUndos() { for (const u of undoToasts.slice()) u.dismiss(); undoToasts = []; }
  function runLatestUndo() {
    const u = undoToasts[undoToasts.length - 1];
    if (!u) return false;
    u.run();
    return true;
  }
  function toast(msg, action) {
    const t = h('div', { class: 'toast' }, h('span', { text: msg }));
    let timer = 0, gone = false;
    const entry = action ? { dismiss: () => dismiss(), run: () => { dismiss(); action.run(); } } : null;
    const dismiss = () => {
      if (gone) return;
      gone = true;
      clearTimeout(timer);
      const hadFocus = t.contains(document.activeElement);
      t.remove();
      if (entry) undoToasts = undoToasts.filter((u) => u !== entry);
      if (hadFocus) (focusBeforeToasts && focusBeforeToasts.isConnected ? focusBeforeToasts : els.canvas).focus({ preventScroll: true });
    };
    if (action) t.append(h('button', { type: 'button', class: 'linkish', 'aria-keyshortcuts': 'Control+Z Meta+Z', onclick: () => entry.run() }, action.label));
    t.append(h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Dismiss', onclick: dismiss }, icon('x')));
    els.toasts.append(t);
    if (entry) undoToasts.push(entry);
    t._dismiss = dismiss;
    while (els.toasts.children.length > 3) els.toasts.firstChild._dismiss();
    const arm = (ms) => { clearTimeout(timer); timer = setTimeout(dismiss, ms); };
    arm(action ? 8000 : 4500);
    const hold = () => clearTimeout(timer);
    t.addEventListener('mouseenter', hold);
    t.addEventListener('focusin', hold);
    t.addEventListener('mouseleave', () => { if (!t.contains(document.activeElement)) arm(3000); });
    t.addEventListener('focusout', (e) => { if (!t.contains(e.relatedTarget)) arm(3000); });
  }

  function tagPopover(anchor) {
    const idx = state.idx;
    const counts = new Map();
    for (const s of idx.skills) for (const t of s._tagIds) counts.set(t, (counts.get(t) || 0) + 1);
    const wrap = h('div', { class: 'tagpop', role: 'group', 'aria-label': 'Filter by tags' });
    wrap.append(h('div', { class: 'tp-head' }, h('span', { class: 'muted', style: 'font-size:12px', text: 'Show skills having every checked tag' }),
      h('button', { type: 'button', class: 'linkish', style: 'font-size:12px', onclick: () => { state.tagFilter.clear(); refilter(); for (const c of wrap.querySelectorAll('input')) c.checked = false; } }, 'Clear')));
    for (const c of CATS) {
      const tags = [...counts.keys()].filter((t) => (idx.tagById.get(t) || { category: catOf(t) }).category === c).sort((a, b) => tagLabel(a).localeCompare(tagLabel(b)));
      if (!tags.length) continue;
      wrap.append(h('h3', { class: `cat-${c}` }, h('span', { class: `pill cat-${c} bare` }, icon(c)), state.view.categories[c].label));
      for (const t of tags) {
        wrap.append(h('label', null, h('input', { type: 'checkbox', value: t, checked: state.tagFilter.has(t), onchange: (e) => { if (e.target.checked) state.tagFilter.add(t); else state.tagFilter.delete(t); refilter(); } }),
          h('span', { text: tagLabel(t) }), h('span', { class: 'n', text: String(counts.get(t)) })));
      }
    }
    if (!counts.size) wrap.append(h('p', { class: 'muted', text: 'No tags were detected.' }));
    openPopover(anchor, wrap, '');
  }

  function insightsPopover(anchor) {
    const idx = state.idx;
    const byKind = new Map();
    for (const i of idx.insights) { if (!byKind.has(i.kind)) byKind.set(i.kind, []); byKind.get(i.kind).push(i); }
    const wrap = h('div', { class: 'inspop', role: 'group', 'aria-label': 'Insights' });
    const kinds = [...byKind.keys()].sort((a, b) => (Object.keys(INSIGHTS).indexOf(a) + 1 || 99) - (Object.keys(INSIGHTS).indexOf(b) + 1 || 99));
    for (const k of kinds) {
      const list = byKind.get(k);
      wrap.append(h('h3', null, INSIGHTS[k] ? INSIGHTS[k].title : k, h('span', { class: 'muted', text: String(list.length) })));
      for (const ins of list) {
        const ids = arr(ins.skills).map(String);
        const names = ids.map((id) => (idx.byId.has(id) ? '/' + idx.byId.get(id).name : id));
        wrap.append(h('button', { type: 'button', onclick: () => { closePopover(false); showInsight(ids); } },
          h('b', { text: names.join(', ') || '—' }), ins.message ? h('div', { text: str(ins.message) }) : null));
      }
    }
    openPopover(anchor, wrap, '');
  }
  function showInsight(ids) {
    const present = ids.filter((id) => state.idx.byId.has(id));
    if (!present.length) return;
    state.highlight = new Set(present);
    follow(present[0], { keepHighlight: true, focusCard: true });
  }

  function cardMenu(anchor) {
    const sid = anchor.dataset.skill;
    const fromPid = anchor.dataset.phase || null;
    const s = state.idx.byId.get(sid);
    if (!s) return;
    const wf = canEdit() ? activeWorkflow() : null;
    const items = [
      { label: 'Open details', run: () => select({ type: 'skill', id: sid }) },
      { label: state.expanded.has(sid) ? 'Hide steps' : 'Show steps', run: () => toggleExpand(sid) },
      { label: 'Focus on linked', disabled: !(state.derived.out.get(sid).size || state.derived.inc.get(sid).size), run: () => setFocus(sid) },
    ];
    if (wf) {
      const member = new Set(phasesOf(sid).map((p) => p.id));
      if (state.grouping === 'workflow') {
        const moveTargets = wf.phases.filter((p) => p.id !== fromPid && !(fromPid === null && member.has(p.id)));
        if (moveTargets.length || fromPid) {
          items.push({ sep: true }, { heading: fromPid ? 'Move to…' : 'Add to…' });
          for (const p of moveTargets) items.push({ label: p.name, run: () => moveSkill(sid, fromPid, p.id) });
          if (fromPid) items.push({ label: 'Unassigned', run: () => moveSkill(sid, fromPid, null) });
        }
        if (fromPid) {
          const also = wf.phases.filter((p) => !member.has(p.id));
          if (also.length) {
            items.push({ heading: 'Also add to…' });
            for (const p of also) items.push({ label: p.name, run: () => { addToPhase(p.id, sid); toast(`Added /${s.name} to ${p.name}`); } });
          }
          items.push({ sep: true }, { label: `Remove from ${findPhase(fromPid)?.name || 'phase'}`, danger: true, run: () => removeWithUndo(fromPid, sid) });
        }
      } else {
        const also = wf.phases.filter((p) => !member.has(p.id));
        if (also.length) {
          items.push({ sep: true }, { heading: `Add to ${wf.name}…` });
          for (const p of also) items.push({ label: p.name, run: () => { addToPhase(p.id, sid); toast(`Added /${s.name} to ${p.name}`); } });
        }
      }
    }
    openMenu(anchor, items);
  }
  function removeWithUndo(pid, sid) {
    const p = findPhase(pid);
    const before = mutate(() => { if (p) p.skills = p.skills.filter((x) => x !== sid); });
    if (!before) return;
    toast(`Removed ${state.idx.byId.has(sid) ? skillLabel(sid) : '/' + sid} from ${p ? p.name : 'phase'}`, { label: 'Undo', run: () => restoreWorkflows(before) });
  }
  function phaseMenu(anchor) {
    const pid = anchor.dataset.phase;
    const wf = activeWorkflow();
    const i = wf ? wf.phases.findIndex((p) => p.id === pid) : -1;
    if (i < 0) return;
    openMenu(anchor, [
      { label: 'Phase details', run: () => select({ type: 'phase', id: pid }) },
      { label: 'Rename', run: () => startRename(pid, anchor.dataset.fk) },
      { label: '◀ Move left', disabled: i === 0, run: () => movePhase(pid, i - 1) },
      { label: 'Move right ▶', disabled: i === wf.phases.length - 1, run: () => movePhase(pid, i + 1) },
      { sep: true },
      { label: 'Delete phase', danger: true, run: () => deletePhase(pid) },
    ]);
  }
  function workflowMenu(anchor) {
    openMenu(anchor, [
      { label: 'New workflow…', run: () => newWorkflowDialog() },
      { label: 'Rename…', run: renameWorkflow },
      { label: 'Duplicate', run: duplicateWorkflow },
      { sep: true },
      { label: 'Delete workflow…', danger: true, run: deleteWorkflow },
    ]);
  }

  // ===================================================================
  // Interaction helpers
  // ===================================================================
  let searchTimer = 0;
  function applySearch() {
    clearTimeout(searchTimer);
    if (state.search === els.search.value) return;
    state.search = els.search.value;
    refilter();
  }
  function setSearch(v) {
    clearTimeout(searchTimer);
    els.search.value = v;
    if (state.search !== v) { state.search = v; refilter(); }
  }
  function refilter() {
    state.visible = computeVisible();
    invalidate('chrome', 'canvas');
  }
  function toggleExpand(id) {
    if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
    invalidate('canvas', 'details');
  }
  function setFocus(id) {
    state.focus = id;
    refilter();
    toast(`Showing ${skillLabel(id)} and every skill linked to or from it`);
  }
  let renameReturn = null;
  function startRename(pid, returnFk) {
    if (!canEdit()) return;
    renameReturn = returnFk || null;
    const g = state.grouping;
    if (g !== 'workflow') { state.grouping = 'workflow'; savePrefs(); }
    state.collapsed.delete(groupPrefix() + pid);
    state.renaming = pid;
    invalidate('chrome', 'canvas');
    flush();
  }
  function finishRename(input, commit) {
    const pid = input.dataset.phase;
    state.renaming = null;
    if (commit) renamePhase(pid, input.value);
    invalidate('canvas');
    flush();
    // Return focus to whatever opened the rename (falls back to the phase name).
    const fk = renameReturn || 'pn|' + pid;
    renameReturn = null;
    const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`) || els.board.querySelector(`[data-fk="${CSS.escape('pn|' + pid)}"]`);
    if (el && (!document.activeElement || document.activeElement === document.body)) el.focus({ preventScroll: true });
  }
  function setGrouping(g) {
    if (g === state.grouping) return;
    state.grouping = g;
    state.renaming = null;
    savePrefs();
    invalidate('chrome', 'canvas', 'details');
  }
  function expandAll() {
    state.collapsed = new Set([...state.collapsed].filter((k) => !k.startsWith(groupPrefix())));
    for (const s of state.idx.skills) if (isVisible(s.id)) state.expanded.add(s.id);
    savePrefs();
    invalidate('canvas', 'details');
  }
  function collapseAll() {
    const groups = computeGroups() || [];
    for (const g of groups) state.collapsed.add(groupKey(g));
    state.expanded.clear();
    savePrefs();
    invalidate('canvas', 'details');
  }
  async function rescan() {
    els.rescan.disabled = true;
    els.rescan.textContent = 'Rescanning…';
    try {
      const res = await fetch('/api/rescan', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Skill-Atlas': '1' }, body: '{}' });
      if (!res.ok) throw new Error(String(res.status));
      setAtlas(await res.json());
      recompute();
      invalidate('chrome', 'canvas', 'details');
      toast(`Rescanned · ${plural(state.idx.skills.length, 'skill')}`);
    } catch {
      toast('Rescan failed — is the Skill Atlas server still running?');
    } finally {
      els.rescan.disabled = false;
      els.rescan.textContent = 'Rescan';
    }
  }
  function downloadWorkflows() {
    const blob = new Blob([JSON.stringify(state.workflows, null, 2) + '\n'], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: 'workflows.json' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  async function copyText(text, btn) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {
      const ta = h('textarea', { style: 'position:fixed;opacity:0' }, text);
      document.body.append(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();
    }
    toast(ok ? 'Path copied' : 'Couldn’t copy — select the path and copy it');
    if (btn) btn.focus();
  }

  // ===================================================================
  // Events (delegated)
  // ===================================================================
  let drag = null;
  function bindEvents() {
    els.seg.addEventListener('click', (e) => { const b = e.target.closest('button[data-g]'); if (b) setGrouping(b.dataset.g); });
    els.seg.addEventListener('keydown', (e) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      const order = ['workflow', 'links', 'source'];
      const i = order.indexOf(state.grouping);
      const next = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3];
      e.preventDefault();
      setGrouping(next);
      flush();
      els.seg.querySelector(`[data-g="${next}"]`).focus();
    });
    els.wfSelect.addEventListener('change', () => {
      const v = els.wfSelect.value;
      if (v === '__new') { els.wfSelect.value = state.workflows.active || ''; newWorkflowDialog(); return; }
      if (v && v !== state.workflows.active && canEdit()) {
        state.workflows.active = v;
        if (state.selection && state.selection.type === 'phase') state.selection = null;
        markDirty();
        invalidate('chrome', 'canvas', 'details');
      }
    });
    els.wfMenu.addEventListener('click', () => { if (popoverOpenFor(els.wfMenu)) closePopover(); else workflowMenu(els.wfMenu); });
    // The box is the source of truth: state.search only follows it, so nothing can put old text back.
    els.search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applySearch, 120);
    });
    els.search.addEventListener('blur', applySearch);
    els.search.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        if (els.search.value) setSearch(''); else els.search.blur();
      } else if (e.key === 'Enter') applySearch();
    });
    els.tagsBtn.addEventListener('click', () => { if (popoverOpenFor(els.tagsBtn)) closePopover(); else tagPopover(els.tagsBtn); });
    els.insights.addEventListener('click', () => { if (popoverOpenFor(els.insights)) closePopover(); else insightsPopover(els.insights); });
    els.mentions.addEventListener('change', () => { state.showMentions = els.mentions.checked; savePrefs(); recompute(); invalidate('chrome', 'canvas', 'details'); });
    els.expandAll.addEventListener('click', expandAll);
    els.collapseAll.addEventListener('click', collapseAll);
    els.rescan.addEventListener('click', rescan);
    els.download.addEventListener('click', downloadWorkflows);
    els.detailsBtn.addEventListener('click', () => { state.detailsOpen = !state.detailsOpen; savePrefs(); invalidate('chrome', 'links'); });
    els.focusChip.addEventListener('click', (e) => { if (e.target.closest('[data-act="clear-focus"]')) { state.focus = null; refilter(); els.search.focus(); } });

    document.addEventListener('focusin', (e) => { if (!els.toasts.contains(e.target)) focusBeforeToasts = e.target; });
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('mousedown', (e) => { if (pop && !pop.el.contains(e.target) && !pop.anchor.contains(e.target)) closePopover(false); }, true);
    document.addEventListener('focusout', (e) => {
      const t = e.target;
      if (t.matches && t.matches('input.col-rename') && state.renaming === t.dataset.phase) finishRename(t, true);
    });

    // Hover emphasis: only class toggles.
    els.board.addEventListener('mouseover', (e) => {
      const card = e.target.closest('.card[data-skill]');
      const id = card ? card.dataset.skill : null;
      if (id !== state.hover) { state.hover = id; applyEmphasis(); }
    });
    els.board.addEventListener('mouseleave', () => { if (state.hover) { state.hover = null; applyEmphasis(); } });

    els.board.addEventListener('dragstart', onDragStart);
    els.board.addEventListener('dragover', onDragOver);
    els.board.addEventListener('dragleave', (e) => { const col = e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) clearDrop(col); });
    els.board.addEventListener('drop', onDrop);
    els.board.addEventListener('dragend', () => { endDrag(); });

    const scheduleLinks = () => invalidate('links');
    window.addEventListener('resize', scheduleLinks);
    if ('ResizeObserver' in window) { const ro = new ResizeObserver(scheduleLinks); ro.observe(els.board); ro.observe(els.canvas); }
    // Links live in the board's own coordinates, so scrolling the canvas needs no redraw;
    // any nested scroller (e.g. a long excerpt) is caught here.
    els.board.addEventListener('scroll', scheduleLinks, true);
    window.addEventListener('resize', positionPopover);
    els.canvas.addEventListener('scroll', () => { if (pop && els.board.contains(pop.anchor)) positionPopover(); }, { passive: true });
  }

  function onClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
    const act = t.dataset.act;
    const sid = t.dataset.skill, pid = t.dataset.phase;
    switch (act) {
      case 'card': {
        const wasSelected = state.selection && state.selection.type === 'skill' && state.selection.id === sid;
        if (state.expanded.has(sid)) state.expanded.delete(sid); else state.expanded.add(sid);
        state.selection = { type: 'skill', id: sid };
        if (!wasSelected) state.highlight = new Set();
        state.detailsOpen = true;
        invalidate('chrome', 'canvas', 'details');
        break;
      }
      case 'card-menu': if (popoverOpenFor(t)) closePopover(); else cardMenu(t); break;
      case 'card-remove': removeWithUndo(pid, sid); break;
      case 'missing-remove': removeWithUndo(pid, t.dataset.name); break;
      case 'step': {
        const st = t.dataset.step;
        if (state.openSteps.has(st)) state.openSteps.delete(st); else state.openSteps.add(st);
        invalidate('canvas');
        break;
      }
      case 'follow': e.stopPropagation(); follow(t.dataset.to); break;
      case 'group-toggle': case 'group-expand': {
        const key = t.dataset.key;
        if (state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
        savePrefs();
        invalidate('canvas');
        // Focus moves to the other control of the same group after re-render.
        flush();
        const other = els.board.querySelector(`[data-fk="${CSS.escape((act === 'group-toggle' ? 'gc|' : 'gt|') + key)}"]`);
        if (other) other.focus({ preventScroll: true });
        break;
      }
      case 'phase-select': {
        const already = state.selection && state.selection.type === 'phase' && state.selection.id === pid;
        if (already) startRename(pid, t.dataset.fk); else select({ type: 'phase', id: pid });
        break;
      }
      case 'phase-rename': startRename(pid, t.dataset.fk); break;
      case 'phase-menu': if (popoverOpenFor(t)) closePopover(); else phaseMenu(t); break;
      case 'phase-left': { const wf = activeWorkflow(); movePhase(pid, wf.phases.findIndex((p) => p.id === pid) - 1); break; }
      case 'phase-right': { const wf = activeWorkflow(); movePhase(pid, wf.phases.findIndex((p) => p.id === pid) + 1); break; }
      case 'phase-delete': deletePhase(pid); break;
      case 'add-phase': addPhase(); flush(); break;
      case 'reload-workflows': reloadWorkflows(); break;
      case 'start-fresh': startFresh(); break;
      case 'preset-start': {
        const p = state.config.presets.find((x) => x.id === t.dataset.preset);
        if (p) createWorkflow(p.name, p, true);
        break;
      }
      case 'blank-start': {
        const p = state.config.presets.find((x) => x.id === 'blank');
        createWorkflow('Workflow', p || null, false);
        break;
      }
      case 'close-details': state.detailsOpen = false; savePrefs(); invalidate('chrome', 'links'); els.detailsBtn.focus(); break;
      case 'focus': setFocus(sid); break;
      case 'toggle-expand': toggleExpand(sid); flush(); follow(sid); break;
      case 'goto-step': follow(sid, { expand: true, openStep: t.dataset.step }); break;
      case 'view-file': fileDialog(sid, t.dataset.path); break;
      case 'copy': copyText(t.dataset.text, t); break;
      default: break;
    }
  }

  function onChange(e) {
    const t = e.target;
    if (t.dataset && t.dataset.act === 'phase-check') {
      const p = findPhase(t.dataset.phase);
      if (!p) return;
      if (t.checked) addToPhase(p.id, t.dataset.skill); else removeFromPhase(p.id, t.dataset.skill);
    }
  }

  let noteTimer = 0;
  function onInput(e) {
    const t = e.target;
    if (t.dataset && t.dataset.act === 'phase-note') {
      const p = findPhase(t.dataset.phase);
      if (!p || !canEdit()) return;
      p.note = t.value;
      markDirty();
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => invalidate('canvas'), 600);
    }
  }

  function onKeyDown(e) {
    const t = e.target;
    if (t.matches && t.matches('input.col-rename')) {
      if (e.key === 'Enter') { e.preventDefault(); finishRename(t, true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finishRename(t, false); }
      return;
    }
    if (document.querySelector('dialog[open]')) return;
    const typing = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
    if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && !(typing && t.matches('input[type="text"], input[type="search"], textarea'))) {
      if (runLatestUndo()) e.preventDefault();
      return;
    }
    if (e.key === 'F6') { e.preventDefault(); toggleDetailsFocus(); return; }
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); els.search.focus(); els.search.select(); return; }
    if (e.key === 'Escape') {
      if (pop) { e.preventDefault(); closePopover(true); return; }
      if (typing && t.tagName === 'TEXTAREA') { t.blur(); return; }
      if (state.selection || state.highlight.size) {
        const sel = state.selection;
        state.selection = null;
        state.highlight = new Set();
        if (window.matchMedia('(max-width: 900px)').matches) state.detailsOpen = false;
        invalidate('chrome', 'details', 'links');
        // Return focus to the card that was selected.
        if (sel && sel.type === 'skill' && els.details.contains(document.activeElement)) {
          flush();
          const inst = (anchors.get(sel.id) || []).find((x) => !x.group);
          if (inst) inst.card.querySelector('.card-main').focus({ preventScroll: true });
        }
        return;
      }
      if (state.focus) { state.focus = null; refilter(); }
    }
  }

  // F6 moves focus between the selected card and the details panel.
  function toggleDetailsFocus() {
    const inDetails = els.details.contains(document.activeElement);
    if (!inDetails) {
      if (!state.detailsOpen) { state.detailsOpen = true; savePrefs(); invalidate('chrome', 'details', 'links'); flush(); }
      const head = els.details.querySelector('.d-head h2');
      if (head) head.focus();
      return;
    }
    const sel = state.selection;
    const inst = sel && sel.type === 'skill' ? (anchors.get(sel.id) || []).find((x) => !x.group) : null;
    const target = inst ? inst.card.querySelector('.card-main')
      : sel && sel.type === 'phase' ? els.board.querySelector(`[data-fk="${CSS.escape('pn|' + sel.id)}"]`) : null;
    (target || els.canvas).focus({ preventScroll: !!target });
    if (target) target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // ---------- drag and drop ----------
  function onDragStart(e) {
    const head = e.target.closest && e.target.closest('.col-head[draggable="true"]');
    if (head && !e.target.closest('input')) {
      drag = { type: 'phase', id: head.dataset.phase };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'phase:' + head.dataset.phase);
      requestAnimationFrame(() => head.closest('.col')?.classList.add('dragging'));
      return;
    }
    const card = e.target.closest && e.target.closest('.card[data-skill][draggable="true"]');
    if (card) {
      drag = { type: 'skill', id: card.dataset.skill, from: card.dataset.phase || null };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', skillLabel(card.dataset.skill));
      requestAnimationFrame(() => card.classList.add('dragging'));
    }
  }
  let dropCol = null;
  function clearDrop(col) {
    const c = col || dropCol;
    if (c) c.classList.remove('drop-ok', 'drop-before', 'drop-after');
    if (!col || col === dropCol) dropCol = null;
  }
  function onDragOver(e) {
    if (!drag) return;
    const col = e.target.closest('.col');
    if (!col) { clearDrop(); return; }
    if (drag.type === 'skill' && col.dataset.drop) {
      if ((col.dataset.phase || null) === drag.from && col.dataset.drop !== '__unassigned') { clearDrop(); return; }
      if (col.dataset.drop === '__unassigned' && !drag.from) { clearDrop(); return; }
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (dropCol !== col) { clearDrop(); dropCol = col; col.classList.add('drop-ok'); }
    } else if (drag.type === 'phase' && col.dataset.phase && col.dataset.phase !== drag.id) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = col.getBoundingClientRect();
      const after = e.clientX > r.left + r.width / 2;
      if (dropCol !== col) clearDrop();
      dropCol = col;
      col.classList.toggle('drop-after', after);
      col.classList.toggle('drop-before', !after);
    } else clearDrop();
  }
  function onDrop(e) {
    if (!drag) return;
    const col = e.target.closest('.col');
    e.preventDefault();
    const d = drag;
    const after = col && col.classList.contains('drop-after');
    endDrag();
    if (!col) return;
    if (d.type === 'skill' && col.dataset.drop) {
      const to = col.dataset.drop === '__unassigned' ? null : col.dataset.drop;
      moveSkill(d.id, d.from, to);
    } else if (d.type === 'phase' && col.dataset.phase && col.dataset.phase !== d.id) {
      const wf = activeWorkflow();
      const from = wf.phases.findIndex((p) => p.id === d.id);
      let to = wf.phases.findIndex((p) => p.id === col.dataset.phase) + (after ? 1 : 0);
      if (from < to) to--;
      movePhase(d.id, to);
    }
  }
  function endDrag() {
    drag = null;
    clearDrop();
    for (const el of els.board.querySelectorAll('.dragging')) el.classList.remove('dragging');
  }

  load();
})();
</script>
</body>
</html>
