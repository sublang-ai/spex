<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Skill Atlas</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --surface-3: #e9ebef;
  --col: #eceef2;
  --border: #e0e3e8;
  --border-2: #c8ccd4;
  --text: #1b1d22;
  --text-2: #50566a;
  --text-3: #6e7483;
  --accent: #5450d0;
  --on-accent: #ffffff;
  --link: #a0a6b3;
  --warn: #b85407;
  --danger: #c02a45;
  --ok: #1d7a4b;
  --focus: #5450d0;
  --shadow-1: 0 1px 2px rgba(16, 18, 24, .06), 0 0 0 1px var(--border);
  --shadow-pop: 0 10px 30px rgba(16, 18, 24, .16), 0 0 0 1px var(--border);
  --c-input: #2f7d6d;
  --c-output: #b4621b;
  --c-tool: #4b63c9;
  --c-human: #b03a78;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --card-w: 256px;
  --col-w: 272px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121317;
    --surface: #1c1d22;
    --surface-2: #23252b;
    --surface-3: #2c2e35;
    --col: #17181c;
    --border: #2c2e35;
    --border-2: #3d4049;
    --text: #e6e7ea;
    --text-2: #aeb2bc;
    --text-3: #8c919c;
    --accent: #908ef5;
    --on-accent: #121317;
    --link: #6b7182;
    --warn: #f0a33f;
    --danger: #f2728a;
    --ok: #4cc38a;
    --focus: #a09ef8;
    --shadow-1: 0 0 0 1px var(--border);
    --shadow-pop: 0 12px 32px rgba(0, 0, 0, .55), 0 0 0 1px var(--border-2);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 var(--font); overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); }
.muted { color: var(--text-3); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border: 1px solid var(--border-2); border-radius: 6px; background: var(--surface);
  cursor: pointer; white-space: nowrap; font-size: 13px;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.btn.danger { color: var(--danger); }
.btn.primary.danger { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.btn.active { border-color: var(--accent); color: var(--accent); }
.btn.active .badge { background: var(--accent); color: var(--on-accent); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0;
  border: 0; border-radius: 5px; background: transparent; color: var(--text-3); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }
input[type="text"], input[type="search"], textarea, select {
  border: 1px solid var(--border-2); border-radius: 6px; background: var(--surface); height: 28px; padding: 0 8px;
}
textarea { height: auto; padding: 6px 8px; resize: vertical; width: 100%; min-height: 64px; line-height: 1.45; }
select { padding-right: 4px; cursor: pointer; }

/* ---------- top bar ---------- */
.topbar { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: 6px 12px; display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 14px; margin: 0; font-weight: 650; white-space: nowrap; }
.brand .summary { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1 1 0; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; padding: 2px; background: var(--surface-2); }
.seg button { height: 22px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 12.5px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border-2); }
.seg-label { color: var(--text-3); font-size: 12px; }
.wf-tools { display: inline-flex; align-items: center; gap: 2px; }
.wf-tools select { max-width: 200px; font-weight: 600; }
.search { position: relative; display: inline-flex; align-items: center; }
.search svg { position: absolute; left: 8px; color: var(--text-3); pointer-events: none; }
.search input { width: 200px; padding-left: 28px; }
.search kbd { position: absolute; right: 7px; font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--border-2); border-radius: 3px; padding: 0 4px; pointer-events: none; }
.search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-2); user-select: none; white-space: nowrap; }
.check input { margin: 0; accent-color: var(--accent); }
.chip-focus { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 13px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--text); font-size: 12.5px; white-space: nowrap; }
.chip-focus b { font-family: var(--mono); font-weight: 600; }
.save-status { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-status.error { color: var(--danger); }
.save-status .linkish { color: var(--danger); font-weight: 600; text-decoration: underline; }
.lang { display: inline-flex; align-items: center; }
.lang select { max-width: 140px; }

/* ---------- layout ---------- */
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.main.no-details { grid-template-columns: minmax(0, 1fr); }
.canvas { position: relative; overflow: auto; min-width: 0; min-height: 0; outline: none; overscroll-behavior: contain; }
.board { position: relative; display: flex; align-items: flex-start; gap: 40px; padding: 12px 20px 48px; min-width: max-content; min-height: 100%; }
#links { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }

/* ---------- columns ---------- */
.col { position: relative; flex: none; width: var(--col-w); background: var(--col); border-radius: 8px; padding: 0 8px 8px; }
.col.wide { width: calc(var(--n) * (var(--card-w) + 8px) + 8px); }
.col.drop-ok { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 7%, var(--col)); }
.col.drop-before::before, .col.drop-after::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--accent); }
.col.drop-before::before { left: -22px; }
.col.drop-after::after { right: -22px; }
.col.dragging { opacity: .5; }
.col-head {
  position: sticky; top: 0; z-index: 3; background: var(--col); margin: 0 -8px; padding: 8px 8px 6px;
  border-radius: 8px 8px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 4px; row-gap: 4px;
}
.col-head[draggable="true"] { cursor: grab; }
.col.selected > .col-head { box-shadow: inset 0 -2px 0 var(--accent); }
.col-title { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.col-name { font-weight: 650; font-size: 13px; border: 0; background: none; padding: 1px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
span.col-name { cursor: default; }
button.col-name:hover { background: var(--surface-3); }
.col-count { color: var(--text-2); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.col-actions { display: flex; gap: 0; }
.col-tags { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; padding-left: 28px; }
.col-rename { width: 100%; height: 24px; font-weight: 600; }
.col-body { display: flex; flex-direction: column; gap: 6px; }
.col.wide .col-body { display: grid; grid-template-columns: repeat(var(--n), var(--card-w)); gap: 6px 8px; align-items: start; }
.col-empty { color: var(--text-2); font-size: 12px; padding: 14px 6px; text-align: center; border: 1px dashed var(--border-2); border-radius: 6px; }
.col.collapsed { width: 200px; padding: 8px; }
.group-card {
  position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 8px 10px; text-align: left;
  border: 0; border-radius: 6px; background: var(--surface); box-shadow: var(--shadow-1); cursor: pointer;
}
.group-card:hover { box-shadow: 0 0 0 1px var(--border-2); }
.group-card .gc-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.group-card .gc-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-card .gc-hint { font-size: 11.5px; color: var(--text-3); }
.add-phase-col { flex: none; width: 150px; padding-top: 4px; }
.add-phase { width: 100%; height: 36px; border: 1px dashed var(--border-2); border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-phase:hover { background: var(--surface); color: var(--text); border-style: solid; }

/* ---------- pills ---------- */
:root { --ct-input: var(--ct-input-l, #24604f); --ct-output: var(--ct-output-l, #8a4a12); --ct-tool: var(--ct-tool-l, #3a4fa6); --ct-human: var(--ct-human-l, #8c2d5f); }
@media (prefers-color-scheme: dark) {
  :root { --ct-input: var(--ct-input-d, #6fb6a5); --ct-output: var(--ct-output-d, #e09a5c); --ct-tool: var(--ct-tool-d, #8d9ee6); --ct-human: var(--ct-human-d, #df82b5); }
}
/* --c is the configured colour (fills, borders); --ct its text colour, held at 4.5:1 or more by applyConfig. */
.cat-input { --c: var(--c-input); --ct: var(--ct-input); }
.cat-output { --c: var(--c-output); --ct: var(--ct-output); }
.cat-tool { --c: var(--c-tool); --ct: var(--ct-tool); }
.cat-human { --c: var(--c-human); --ct: var(--ct-human); }
.pills { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 4px 0 3px; border-radius: 4px;
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--ct);
  background: color-mix(in srgb, var(--c) 13%, transparent);
}
.pill svg.i { width: 12px; height: 12px; stroke-width: 1.8; }
.pill.bare { padding: 0 3px; background: transparent; }
.tagchip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11.5px; white-space: nowrap;
  color: var(--ct);
  background: color-mix(in srgb, var(--c) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 24%, transparent);
}
.tagchip svg.i { width: 12px; height: 12px; }

/* ---------- cards ---------- */
.card {
  position: relative; z-index: 2; width: var(--card-w); background: var(--surface); border-radius: 6px; box-shadow: var(--shadow-1);
  scroll-margin: 96px 40px 40px 40px;
}
.col:not(.wide) .card { width: 100%; }
.card:hover { box-shadow: 0 1px 3px rgba(16, 18, 24, .08), 0 0 0 1px var(--border-2); }
.card.selected { box-shadow: 0 0 0 2px var(--accent); }
.card.nb { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
.card.hl { box-shadow: 0 0 0 2px var(--warn); }
.card.selected.hl { box-shadow: 0 0 0 2px var(--accent); }
.card.dragging { opacity: .45; }
.card[draggable="true"] { cursor: grab; }
.card.flash { animation: flash 1.3s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  35% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); }
  100% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 0 transparent; }
}
.card-main {
  display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 7px 10px 8px; text-align: left;
  border: 0; background: transparent; border-radius: 6px; cursor: pointer; min-width: 0;
}
.card-main:focus-visible { outline-offset: -2px; }
.card-top { display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 44px; min-height: 20px; }
.card.in-phase .card-top { padding-right: 46px; }
.card:not(.in-phase) .card-top { padding-right: 24px; }
.card-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card-src { flex: 0 1 auto; min-width: 40px; font-size: 10.5px; color: var(--text-2); border: 1px solid var(--border-2); border-radius: 3px; padding: 0 4px; line-height: 15px; max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-copies { flex: none; font-size: 10.5px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
.issue-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.card-desc { color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-height: 18px; margin-top: 2px; }
.card-foot .pills { flex-wrap: nowrap; }
.card-meta { color: var(--text-3); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; flex: none; }
.card-tools { position: absolute; top: 4px; right: 4px; display: flex; gap: 0; }
.card-tools .icon-btn { width: 22px; height: 22px; }
.card.missing { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); border: 0; }
.card.missing .card-main { cursor: default; }
.card.missing .card-name { color: var(--text-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-3) 50%, transparent); }
.card-taglist { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 8px; }

/* ---------- steps ---------- */
.steps { border-top: 1px solid var(--border); padding: 4px 0 6px; }
.steps-head { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: 4px 10px 2px; font-weight: 600; }
.steps-none { color: var(--text-3); font-size: 12px; padding: 4px 10px 6px; }
.step-line { display: flex; align-items: flex-start; gap: 4px; padding: 0 6px 0 4px; flex-wrap: wrap; }
.step-main { display: flex; align-items: flex-start; gap: 6px; flex: 1 1 140px; min-width: 0; border: 0; background: transparent; padding: 3px 4px; border-radius: 4px; cursor: pointer; text-align: left; }
.step-main:hover { background: var(--surface-2); }
.step.open > .step-line .step-main { background: var(--surface-2); }
.step-idx { flex: none; min-width: 16px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; padding-top: 1px; }
.step-title { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.step-tags { flex: none; display: inline-flex; gap: 1px; padding-top: 1px; }
.step-calls { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 0; margin-left: 24px; }
.step-line .step-calls { flex-basis: 100%; }
.call-chip {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; font: 600 11px var(--mono);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); color: color-mix(in srgb, var(--accent) 85%, var(--text)); cursor: pointer; white-space: nowrap;
}
.call-chip:hover { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.call-chip.mention { border-style: dashed; background: transparent; }
.call-chip.unresolved { border-style: dashed; border-color: var(--border-2); color: var(--text-3); background: transparent; cursor: help; }
.step-body { margin: 2px 8px 6px 28px; padding: 6px 8px; background: var(--surface-2); border-radius: 5px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.step-body .lines { color: var(--text-3); font-size: 11px; }
.excerpt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); max-height: 160px; overflow: auto; }
.ev-tag { display: flex; flex-direction: column; gap: 2px; }
.ev { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
.ev li { display: flex; gap: 6px; font-size: 11.5px; color: var(--text-2); min-width: 0; }
.ev .ln { flex: none; font-family: var(--mono); color: var(--text-3); min-width: 34px; }
.ev .tx { min-width: 0; overflow-wrap: anywhere; }

/* ---------- links ---------- */
.lk path.ln { fill: none; stroke: var(--link); stroke-width: 1.3; }
.lk.calls path.ln { marker-end: url(#ar); }
.lk.mentions path.ln { stroke-dasharray: 4 3; marker-end: url(#ar-m); }
#links .ah { fill: var(--link); }
#links .ah-hot { fill: var(--accent); }
#links.emph .lk { opacity: .13; }
#links.emph .lk.hot { opacity: 1; }
.lk.hot path.ln { stroke: var(--accent); stroke-width: 2; }
.lk.hot.calls path.ln { marker-end: url(#ar-hot); }
.lk.hot.mentions path.ln { marker-end: url(#ar-hot-m); }
.lk .cnt rect { fill: var(--surface); stroke: var(--border-2); }
.lk .cnt text { font: 600 10px var(--font); fill: var(--text-2); }
.lk.hot .cnt rect { stroke: var(--accent); }

/* ---------- empty states ---------- */
.empty { margin: 48px auto; max-width: 560px; padding: 24px; text-align: left; }
.empty h2 { font-size: 16px; margin: 0 0 6px; }
.empty p { color: var(--text-2); margin: 0 0 14px; }
.empty ul { margin: 0; padding-left: 18px; color: var(--text-2); }
.empty code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin: 0 0 12px; }
.preset-btn {
  display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--surface);
  text-align: left; cursor: pointer;
}
.preset-btn:hover { border-color: var(--accent); }
.preset-btn b { font-size: 13px; }
.preset-btn span { color: var(--text-2); font-size: 12px; }
.preset-btn .phases { color: var(--text-3); font-size: 11.5px; }

/* ---------- details ---------- */
.details { min-width: 0; border-left: 1px solid var(--border); background: var(--surface); overflow: auto; overscroll-behavior: contain; }
.d-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 8px 16px; border-bottom: 1px solid var(--border); }
.d-head h2 { margin: 0; font-size: 15px; font-weight: 650; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.d-head h2.mono { font-size: 14px; }
.d-kicker { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 2px; }
.d-body { padding: 10px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.d-sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 0 0 6px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.d-sec h4 { font-size: 12px; margin: 8px 0 4px; display: flex; align-items: center; gap: 6px; }
.d-desc { margin: 0; color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
.d-summary { margin: 0; color: var(--text-2); font-style: italic; }
.d-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.d-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.d-list li { min-width: 0; }
.d-list .sub { color: var(--text-3); font-size: 11.5px; overflow-wrap: anywhere; }
.d-path { display: flex; gap: 6px; align-items: flex-start; }
.d-path code { flex: 1; min-width: 0; font: 11.5px var(--mono); color: var(--text-2); overflow-wrap: anywhere; background: var(--surface-2); padding: 4px 6px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: 12px; }
.kv dt { color: var(--text-3); font-family: var(--mono); font-size: 11.5px; }
.kv dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; }
.issues { margin: 0; padding: 8px 10px 8px 26px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); color: var(--text); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.phase-checks { display: flex; flex-direction: column; gap: 4px; }
.phase-checks .check { color: var(--text); }
.step-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.step-list button { width: 100%; display: flex; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.step-list button:hover { background: var(--surface-2); }
.step-list .n { color: var(--text-3); font-size: 11px; min-width: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.step-list .t { flex: 1; min-width: 0; }
.step-list .l { color: var(--text-3); font-size: 11px; font-family: var(--mono); }
.link-item { display: flex; flex-direction: column; gap: 1px; }
.link-item .top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.kind { font-size: 10.5px; color: var(--text-3); border: 1px solid var(--border-2); border-radius: 3px; padding: 0 4px; line-height: 15px; }
.files li { display: flex; gap: 6px; align-items: baseline; }
.files .linkish, .files .fname { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend svg.line { width: 40px; height: 10px; flex: none; }
.d-close-row { display: none; }
.tag-row { display: flex; flex-direction: column; gap: 3px; padding: 4px 0; border-top: 1px solid var(--border); }
.tag-row:first-of-type { border-top: 0; }
.tag-row .who { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
.src-badge { font-size: 10.5px; color: var(--text-3); }
.tr-note { margin: 0; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-2); overflow-wrap: anywhere; }
.tr-note.stale { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }

/* ---------- popovers, dialogs, toasts ---------- */
.popover { position: fixed; z-index: 50; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-pop); max-height: min(70vh, 560px); overflow: auto; overscroll-behavior: contain; }
.menu { display: flex; flex-direction: column; padding: 4px; min-width: 200px; max-width: 300px; }
.menu-i { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 0; background: none; border-radius: 4px; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-i:hover, .menu-i:focus { background: var(--surface-3); outline: none; }
.menu-i:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.menu-i:disabled { color: var(--text-3); cursor: default; background: none; }
.menu-i.danger { color: var(--danger); }
.menu-h { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: 8px 10px 2px; font-weight: 600; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.tagpop { width: 320px; padding: 8px 12px 12px; }
.tagpop .tp-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 0 4px; }
.tagpop h3 { font-size: 12px; margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
.tagpop label { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
.tagpop label input { accent-color: var(--accent); margin: 0; }
.tagpop .n { margin-left: auto; color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.inspop { width: 400px; max-width: calc(100vw - 16px); padding: 4px 0 8px; }
.inspop h3 { font-size: 12px; margin: 0; padding: 10px 14px 4px; display: flex; gap: 6px; align-items: baseline; }
.inspop h3 .muted { font-weight: 400; }
.inspop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 14px; cursor: pointer; font-size: 12px; color: var(--text-2); }
.inspop button:hover, .inspop button:focus-visible { background: var(--surface-2); }
.inspop button b { color: var(--text); font-family: var(--mono); font-weight: 600; }
dialog.dlg { border: 0; padding: 0; border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop); width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog.dlg.wide { width: min(860px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgba(10, 12, 16, .35); }
.dlg-form { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.dlg-head h2 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dlg-body { padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; min-height: 0; }
.dlg-body p { margin: 0; color: var(--text-2); }
.dlg-body label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px; }
.dlg-body label.field input { font-weight: 400; font-size: 13px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.radio-list { display: flex; flex-direction: column; gap: 4px; }
.radio-list label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
.radio-list label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.radio-list input { margin: 2px 0 0; accent-color: var(--accent); }
.radio-list .rl-name { font-weight: 600; }
.radio-list .rl-sub { color: var(--text-3); font-size: 11.5px; }
.file-pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); padding: 10px 12px; border-radius: 6px; min-height: 120px; }
.err-text { color: var(--danger); font-size: 12px; min-height: 16px; }
.toasts { position: fixed; left: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 8px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-pop); max-width: min(480px, calc(100vw - 32px)); font-size: 13px; }
.toast .linkish { color: var(--bg); font-weight: 650; text-decoration: underline; }
.toast .icon-btn { color: var(--bg); opacity: .7; }
.toast .icon-btn:hover { background: transparent; opacity: 1; }
.banner { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); color: var(--text); font-weight: 600; }
.empty.notice { border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 10px; background: var(--surface); }
.notice-msg { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.fatal { margin: 80px auto; max-width: 520px; padding: 24px; }
.fatal h2 { font-size: 16px; margin: 0 0 8px; }
.fatal p { color: var(--text-2); }
.fatal code { font-family: var(--mono); font-size: 12px; }

/* ---------- narrow: details as a bottom sheet ---------- */
@media (max-width: 900px) {
  .main, .main.no-details { grid-template-columns: minmax(0, 1fr); }
  .details {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 40; border-left: 0; border-top: 1px solid var(--border-2);
    border-radius: 12px 12px 0 0; box-shadow: var(--shadow-pop);
  }
  .main.no-details .details { display: none; }
  .search input { width: 160px; }
  .canvas { padding-bottom: 0; }
  .main:not(.no-details) .board { padding-bottom: 54vh; }
}
@media (min-width: 901px) {
  .main.no-details .details { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  .card.flash { animation: none; box-shadow: 0 0 0 3px var(--accent); }
}

<body>
<script id="atlas-embedded" type="application/json"></script>
<header class="topbar">
  <div class="bar-row">
    <div class="brand">
      <h1 id="title">Skill Atlas</h1>
      <span id="summary" class="summary"></span>
    </div>
    <div class="spacer"></div>
    <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
    <button id="btn-insights" class="btn" type="button" aria-haspopup="true" aria-expanded="false"><span data-i18n="insights">Insights</span> <span class="badge" id="insights-n">0</span></button>
    <button id="btn-rescan" class="btn" type="button" hidden>Rescan</button>
    <button id="btn-download" class="btn" type="button" hidden>Download workflows.json</button>
    <button id="btn-details" class="btn" type="button" aria-controls="details" aria-expanded="true">Details</button>
    <span class="lang">
      <label class="sr-only" for="lang-select" id="lang-label">Language</label>
      <select id="lang-select"><option value="en-US">English</option></select>
    </span>
  </div>
  <div class="bar-row">
    <span class="seg-label" id="seg-label">Group by</span>
    <div class="seg" id="grouping" role="radiogroup" aria-labelledby="seg-label">
      <button type="button" role="radio" data-g="workflow" aria-checked="false">Workflow</button>
      <button type="button" role="radio" data-g="links" aria-checked="false">Links</button>
      <button type="button" role="radio" data-g="source" aria-checked="false">Source</button>
    </div>
    <div class="wf-tools" id="wf-tools">
      <label class="sr-only" for="wf-select" id="wf-label">Active workflow</label>
      <select id="wf-select"></select>
      <button id="wf-menu" class="icon-btn" type="button" aria-label="Workflow actions" aria-haspopup="true" aria-expanded="false"></button>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Search skills" aria-label="Search skills by name, description or step" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button id="btn-tags" class="btn" type="button" aria-haspopup="true" aria-expanded="false"><span data-i18n="tags">Tags</span> <span class="badge" id="tags-n" hidden></span></button>
    <label class="check"><input type="checkbox" id="chk-mentions"> <span data-i18n="mentions">Mentions</span></label>
    <span id="focus-chip"></span>
    <div class="spacer"></div>
    <button id="btn-expand" class="btn ghost" type="button">Expand all</button>
    <button id="btn-collapse" class="btn ghost" type="button">Collapse all</button>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-label="Notifications"></div>
<main class="main" id="main">
  <div id="canvas" class="canvas" tabindex="-1" aria-label="Skills canvas">
    <div id="board" class="board">
      <svg id="links" aria-hidden="true" width="0" height="0">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 1 L10 5 L0 9 z"/></marker>
          <marker id="ar-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 1 L10 5 L0 9 z"/></marker>
          <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-hot" d="M0 1 L10 5 L0 9 z"/></marker>
          <marker id="ar-hot-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-hot" d="M0 1 L10 5 L0 9 z"/></marker>
        </defs>
        <g id="link-layer"></g>
      </svg>
    </div>
  </div>
  <aside id="details" class="details" aria-label="Details"></aside>
</main>
<script>
(() => {
  'use strict';

  // ===================================================================
  // Constants
  // ===================================================================

    categories: {
      input: { label: '', color: '#2f7d6d' },
      output: { label: '', color: '#b4621b' },
      tool: { label: '', color: '#4b63c9' },
      human: { label: '', color: '#b03a78' },

  const DEFAULT_CATEGORY = {
    input: () => t('Data in'),
    output: () => t('Data out'),
    tool: () => t('Tools'),
    human: () => t('Human'),

  // Each insight kind's heading, the issue line a skill shows, and its message built from `params`

    'duplicate-name': {
      title: () => t('Installed more than once'),
      issue: () => t('Another skill with the same name is installed, so an agent may load either copy.'),

    'unresolved-link': {
      title: () => t('Links to skills that are not installed'),
      issue: () => t('Links to a skill that is not installed.'),
      message: (p) => (p.name == null ? null : t('{from} links to “{name}”, which is not installed', { from: str(p.from), name: p.name })),
    },
    'cycle': {
      title: () => t('Skills that link to each other in a loop'),
      issue: () => t('Is part of a loop of skills that link back to each other.'),

      message: (p, ins) => (!Array.isArray(p.path) ? null : t('{n} skills call each other in a loop, for example {path}', { n: Math.max(arr(ins.skills).length, p.path.length), path: [...p.path, p.path[0]].map(str).join(' → ') })),

    'oversized': {
      title: () => t('Longer than 500 lines'),

    'missing-description': {
      title: () => t('No description'),
      issue: () => t('Has no description, so an agent cannot tell when to use it.'),

    'name-mismatch': {

    'invalid-frontmatter': {
      title: () => t('Frontmatter could not be read'),
      issue: () => t('Its frontmatter could not be parsed, so its name, description or settings may be missing or wrong.'),

    'no-steps': {
      title: () => t('No steps detected'),
      issue: () => t('No steps or sections were found in SKILL.md.'),

      title: () => t('Translations behind their source'),
      issue: () => t('A translation may be behind its source.'),

    'edited-translation': {
      title: () => t('Translations edited apart from their source'),
      issue: () => t('A translation was edited apart from its source, which agents follow.'),
      message: (p) => (p.lang == null ? null : t('The {language} translation was edited apart from its source: {files}', { language: languageName(p.lang), files: list(arr(p.files).map(str)) })),

    'stale-annotation': {
      title: () => t('Annotations written from another text'),
      issue: () => t('An annotation was written from another text of this skill; read the skill again and update or remove it.'),

    },
    'translation-steps': {
      title: () => t('Translations whose steps differ'),
      issue: () => t('A translation’s steps number otherwise than the skill’s.'),
      message: (p) => (p.lang == null ? null : t('The {language} translation has {n} step where the skill has {expected}; its steps are not shown|The {language} translation has {n} steps where the skill has {expected}; its steps are not shown', { language: languageName(p.lang), n: Number(p.steps) || 0, expected: p.expected })),
    },
  };
  const insightTitle = (kind) => (INSIGHTS[kind] ? INSIGHTS[kind].title() : kind);
  const insightIssue = (kind) => (INSIGHTS[kind] ? INSIGHTS[kind].issue() : kind);
  function insightMessage(ins) {
    const def = INSIGHTS[ins.kind];
    const p = ins.params && typeof ins.params === 'object' ? ins.params : null;
    const m = def ? def.message(p || {}, ins) : null;
    return m != null ? m : str(ins.message);
  }
  // Trusted, static icon markup only; never interpolate data into these.
  const ICONS = {
    input: '<path d="M8 2v7.5M4.8 6.4 8 9.6l3.2-3.2M2.5 11v2.5h11V11"/>',
    output: '<path d="M8 10V2.5M4.8 5.6 8 2.4l3.2 3.2M2.5 11v2.5h11V11"/>',
    tool: '<path d="M10.6 2.4a3.1 3.1 0 0 0-3.4 4.1L2.6 11.1a1.3 1.3 0 0 0 0 1.8l.5.5a1.3 1.3 0 0 0 1.8 0l4.6-4.6a3.1 3.1 0 0 0 4.1-3.4l-1.9 1.9-2-.5-.5-2z"/>',
    human: '<circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 13.8c.4-2.6 2.6-4.3 5.2-4.3s4.8 1.7 5.2 4.3"/>',
    chevronDown: '<path d="M4 6l4 4 4-4"/>',
    chevronRight: '<path d="M6 4l4 4-4 4"/>',
    dots: '<circle cx="3.5" cy="8" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/><circle cx="12.5" cy="8" r=".9" fill="currentColor"/>',
    x: '<path d="M4 4l8 8M12 4l-8 8"/>',
    plus: '<path d="M8 3v10M3 8h10"/>',
    pencil: '<path d="M10.5 2.8l2.7 2.7-7.7 7.7H2.8v-2.7z"/>',
    search: '<circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 13.5 13.5"/>',
    copy: '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.8A1.3 1.3 0 0 0 9.2 2.5H3.8a1.3 1.3 0 0 0-1.3 1.3v5.4a1.3 1.3 0 0 0 1.3 1.3h1.7"/>',
  };

  // ===================================================================
  // Small DOM helpers (text always goes through textContent / text nodes)
  // ===================================================================
  const $ = (sel, root = document) => root.querySelector(sel);
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {

        if (v == null || v === false) continue;

        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style') el.style.cssText = v;
        else if (k === 'value') el.value = v;
        else if (k === 'checked') el.checked = !!v;
        else if (v === true) el.setAttribute(k, '');

    appendKids(el, kids);

  }
  function appendKids(el, kids) {
    for (const k of kids) {
      if (k == null || k === false) continue;

      else el.append(k instanceof Node ? k : String(k));
    }
  }
  const iconCache = new Map();
  function icon(name, cls) {
    let tpl = iconCache.get(name);
    if (!tpl) {
      tpl = document.createElement('template');
      tpl.innerHTML = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true" focusable="false">' + (ICONS[name] || '') + '</svg>';

    if (cls) svg.classList.add(cls);
    return svg;
  }
  const arr = (v) => (Array.isArray(v) ? v : []);
  const str = (v) => (v == null ? '' : String(v));
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let uid = 0;
  function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } }

  // ---------- category text colours with a 4.5:1 floor ----------
  function toRgb(color) {

      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#000';
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 1, 1);

      return [d[0], d[1], d[2]];

    dark: { text: [230, 231, 234], bgs: [[28, 29, 34], [23, 24, 28], [35, 37, 43]] },

  // The configured colour moved toward the theme's text colour just far enough to read at 4.5:1
  // on every background a category label sits on (its own tint over the surfaces).
  function categoryTextColors(color) {
    const c = toRgb(color);
    if (!c) return null;
    const out = {};
    for (const [name, th] of Object.entries(THEMES)) {
      const bgs = th.bgs.map((bg) => mixRgb(bg, c, 0.13));
      let pick = th.text;
      for (let k = 0; k <= 1.0001; k += 0.02) {
        const fg = mixRgb(c, th.text, k);

    const fromName = fromPid ? findPhase(fromPid)?.name : '';
    const before = mutate(() => {
      if (fromPid) { const f = findPhase(fromPid); if (f) f.skills = f.skills.filter((x) => x !== sid); }
      if (toPid) { const to = findPhase(toPid); if (to && !to.skills.includes(sid)) to.skills.push(sid); }
    });
    if (!before) return;
    // A skill still in another phase is not unassigned: say what actually happened.
    const msg = !toPid && phasesOf(sid).length ? t('Removed {skill} from {phase}', { skill: name, phase: fromName }) : t('Moved {skill} to {phase}', { skill: name, phase: toName });
    toast(msg, undoAction());
  }
  function addPhase() {
    const wf = activeWorkflow();
    if (!wf) return;
    const names = new Set(wf.phases.map((p) => p.name));
    const name = uniqueId(t('New phase'), names).replace(/-(\d+)$/, ' $1');
    const id = uniqueId('p-' + slugify(name), new Set(wf.phases.map((p) => p.id)));
    if (mutate(() => { wf.phases.push({ id, name, note: '', skills: [] }); })) state.renaming = id;
  }
  function renamePhase(pid, name) {
    name = str(name).trim();
    const p = findPhase(pid);
    if (!p || !name || name === p.name) return;
    mutate(() => { p.name = name; });
  }
  function movePhase(pid, toIndex) {
    const wf = activeWorkflow();
    if (!wf) return;
    const from = wf.phases.findIndex((p) => p.id === pid);
    if (from < 0) return;
    toIndex = Math.max(0, Math.min(wf.phases.length - 1, toIndex));
    if (toIndex === from) return;
    mutate(() => { const [p] = wf.phases.splice(from, 1); wf.phases.splice(toIndex, 0, p); });
  }
  async function deletePhase(pid) {
    const wf = activeWorkflow();
    const p = findPhase(pid);
    if (!wf || !p) return;
    if (p.skills.length) {
      const ok = await confirmDialog({ title: t('Delete phase “{name}”?', { name: p.name }), body: t('Its {n} skill will go back to Unassigned. Nothing is uninstalled.|Its {n} skills will go back to Unassigned. Nothing is uninstalled.', { n: p.skills.length }), confirm: t('Delete phase'), danger: true });
      if (!ok) return;
    }
    const before = mutate(() => { wf.phases = wf.phases.filter((x) => x.id !== pid); });
    if (!before) return;
    if (state.selection && state.selection.type === 'phase' && state.selection.id === pid) state.selection = null;
    toast(t('Deleted phase {name}', { name: p.name }), undoAction());
  }
  function createWorkflow(name, preset, place) {
    const doc = state.workflows;
    const id = uniqueId('wf-' + slugify(name), new Set(doc.workflows.map((w) => w.id)));
    // A preset's phases take their names in the shown language; the keywords stay the source's.
    const presetPhases = preset ? arr(preset.phases) : [{ name: t('Phase {n}', { n: 1 }), keywords: [] }];
    const pIds = new Set();
    const phases = presetPhases.map((p, i) => {
      const pname = (preset ? presetPhaseName(preset, i) : str(p.name)) || t('Phase');
      const pid = uniqueId('p-' + slugify(str(p.name) || pname), pIds); pIds.add(pid);
      return { id: pid, name: pname, note: '', skills: [] };
    });
    const wf = { id, name, phases };
    if (!mutate((d) => { d.workflows.push(wf); d.active = id; })) return;
    state.grouping = 'workflow';
    savePrefs();
    if (place && preset) {
      const { placed, count } = placeByKeywords(presetPhases, state.idx.skills);
      if (count) {
        const before = mutate(() => { placed.forEach((ids, i) => { phases[i].skills = ids.slice(); }); });
        if (!before) return;
        toast(t('Placed {n} skill by keyword|Placed {n} skills by keyword', { n: count }), undoAction());
      } else {
        toast(t('No skill matched this preset’s keywords — drag skills into phases'));
      }
    }
  }
  async function renameWorkflow() {
    const wf = activeWorkflow();
    if (!wf) return;
    const name = await promptDialog({ title: t('Rename workflow'), label: t('Name'), value: wf.name, confirm: t('Rename') });
    if (name && name !== wf.name) mutate(() => { wf.name = name; });
  }
  function duplicateWorkflow() {
    const wf = activeWorkflow();
    if (!wf) return;
    const names = new Set(state.workflows.workflows.map((w) => w.name));
    const name = uniqueId(t('{name} copy', { name: wf.name }), names).replace(/-(\d+)$/, ' $1');
    const id = uniqueId('wf-' + slugify(name), new Set(state.workflows.workflows.map((w) => w.id)));
    if (mutate((d) => { const c = clone(wf); c.id = id; c.name = name; d.workflows.splice(d.workflows.indexOf(wf) + 1, 0, c); d.active = id; })) toast(t('Duplicated as {name}', { name }));
  }
  async function deleteWorkflow() {
    const wf = activeWorkflow();
    if (!wf) return;
    const ok = await confirmDialog({ title: t('Delete workflow “{name}”?', { name: wf.name }), body: t('Its {n} phase and its placements are removed. Skills are not affected.|Its {n} phases and their placements are removed. Skills are not affected.', { n: wf.phases.length }), confirm: t('Delete workflow'), danger: true });
    if (!ok) return;
    const before = mutate((d) => { d.workflows = d.workflows.filter((w) => w.id !== wf.id); d.active = d.workflows.length ? d.workflows[0].id : null; });
    if (!before) return;

  }

  // ===================================================================
  // Render scheduler
  // ===================================================================
  const dirty = { chrome: false, canvas: false, details: false, links: false };
  let rafId = 0;
  function invalidate(...parts) {
    for (const p of parts) dirty[p] = true;
    if (!rafId) rafId = requestAnimationFrame(flush);
  }
  function flush() {
    cancelAnimationFrame(rafId);
    rafId = 0;
    const d = { ...dirty };
    dirty.chrome = dirty.canvas = dirty.details = dirty.links = false;
    if (d.chrome) renderChrome();
    if (d.canvas) renderCanvas();
    if (d.details) renderDetails();
    if (d.canvas || d.links) drawLinks();
    if (d.canvas || d.details || d.links) syncSelection();
  }

  // ===================================================================
  // Chrome (top bar)
  // ===================================================================
  function renderChrome() {
    const idx = state.idx;
    const staticMode = state.mode === 'static';
    const nLinks = state.derived.shown.length;
    els.summary.textContent = [t('{n} skill|{n} skills', { n: idx.skills.length }), t('{n} source|{n} sources', { n: idx.roots.length }), t('{n} link|{n} links', { n: nLinks })].join(' · ');
    const scanned = state.atlas.generatedAt ? fmtDate(state.atlas.generatedAt) : '';
    if (scanned) els.summary.title = t('Scanned {time}', { time: scanned }); else els.summary.removeAttribute('title');
    for (const b of els.seg.querySelectorAll('button')) {
      const on = b.dataset.g === state.grouping;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    }
    els.wfTools.hidden = state.grouping !== 'workflow';
    const sel = els.wfSelect;
    sel.replaceChildren();
    const wfs = state.workflows.workflows;
    if (!wfs.length) sel.append(h('option', { value: '', disabled: true, selected: true }, t('No workflows yet')));
    for (const w of wfs) sel.append(h('option', { value: w.id, selected: w.id === state.workflows.active ? true : null }, w.name));
    sel.append(h('option', { value: '__new' }, t('New workflow…')));
    sel.value = state.workflows.active || '';
    const blocked = state.wfBlocked;
    sel.disabled = !!blocked;
    els.wfMenu.disabled = !wfs.length || !!blocked;
    const conflict = !!blocked && blocked.kind === 'conflict';
    if (conflict !== !els.banner.hidden || els.banner.dataset.lang !== i18n.lang) {
      els.banner.hidden = !conflict;
      els.banner.dataset.lang = i18n.lang;
      els.banner.replaceChildren();
      if (conflict) {
        els.banner.append(h('span', { text: t('Workflows were changed elsewhere — your last edit was not saved.') }),
          h('button', { type: 'button', class: 'btn small', 'data-act': 'reload-workflows' }, t('Reload')));
      }
    }
    const nTags = state.tagFilter.size;
    els.tagsN.hidden = !nTags;
    els.tagsN.textContent = fmtNum(nTags);
    els.tagsBtn.classList.toggle('active', nTags > 0);
    els.tagsBtn.setAttribute('aria-label', nTags ? t('Tags, {n} selected', { n: nTags }) : t('Filter by tags'));
    els.mentions.checked = state.showMentions;
    els.focusChip.replaceChildren();
    if (state.focus && idx.byId.has(state.focus)) {
      const s = idx.byId.get(state.focus);
      els.focusChip.append(h('span', { class: 'chip-focus' }, withNodes(t('Focused on {skill}'), { skill: h('b', { text: '/' + s.name }) }),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': t('Clear focus on {skill}', { skill: '/' + s.name }), 'data-act': 'clear-focus' }, icon('x'))));
    }
    const nIns = idx.insights.length;
    els.insightsN.textContent = fmtNum(nIns);
    els.insights.disabled = !nIns;
    els.rescan.hidden = staticMode;
    els.download.hidden = !staticMode;
    els.detailsBtn.setAttribute('aria-expanded', String(state.detailsOpen));
    els.main.classList.toggle('no-details', !state.detailsOpen);
  }

  // ===================================================================
  // Canvas
  // ===================================================================
  // Anchors recorded during render, consumed by drawLinks: skill id -> instances.
  let anchors = new Map();

  let renderingBoard = false;
  function renderCanvas() {
    const board = els.board;
    const active = document.activeElement;
    const fk = active && board.contains(active) && active.closest('[data-fk]') ? active.closest('[data-fk]').dataset.fk : null;
    // A phase name being typed survives a re-render (a language change among them).
    const oldRename = board.querySelector('input.col-rename');
    const renameDraft = oldRename && state.renaming === oldRename.dataset.phase ? { value: oldRename.value, focused: oldRename === active, start: oldRename.selectionStart, end: oldRename.selectionEnd } : null;
    // Removing a focused rename input fires focusout, which must not commit the draft kept above.
    renderingBoard = true;
    try { for (const n of [...board.children]) if (n !== els.svg) n.remove(); } finally { renderingBoard = false; }
    anchors = new Map();
    const idx = state.idx;
    if (!idx.skills.length) { board.append(renderNoSkills()); return; }
    const blocked = state.wfBlocked;
    if (state.grouping === 'workflow' && blocked && blocked.kind !== 'conflict') { board.append(renderWorkflowBlocked(blocked)); return; }
    const groups = computeGroups();
    if (!groups) { board.append(renderWorkflowEmpty()); return; }
    const frag = document.createDocumentFragment();
    groups.forEach((g, i) => {
      if (g.kind === 'unassigned') { const add = renderAddPhase(); if (add) frag.append(add); }
      frag.append(renderGroup(g, i));
    });
    board.append(frag);
    if (state.renaming) {
      const input = board.querySelector('input.col-rename');
      if (input && renameDraft) {
        input.value = renameDraft.value;
        if (renameDraft.focused) { input.focus({ preventScroll: true }); try { input.setSelectionRange(renameDraft.start, renameDraft.end); } catch { /* not a text input */ } }
      } else if (input) { input.focus(); input.select(); }
    } else if (fk) {
      const el = board.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
      if (el) el.focus({ preventScroll: true });
    }
  }

  function pushAnchor(sid, inst) {
    if (!anchors.has(sid)) anchors.set(sid, []);
    anchors.get(sid).push(inst);
  }

  function renderNoSkills() {
    const roots = state.idx.roots;
    return h('div', { class: 'empty' },
      h('h2', { text: t('No skills found') }),
      h('p', { text: roots.length ? t('The scan looked for folders containing a SKILL.md in these places and found none:') : t('The scan had no folders to look in.') }),
      roots.length ? h('ul', null, roots.map((r) => h('li', null, h('code', { text: str(r.path) || str(r.id) }), r.label ? ` — ${rootName(r)}` : ''))) : null,
      state.mode === 'live' ? h('p', { style: 'margin-top:14px', text: t('Install a skill, then use Rescan.') }) : null);
  }

  function renderWorkflowBlocked(b) {
    if (b.kind === 'invalid') {
      return h('div', { class: 'empty notice', role: 'region', 'aria-label': t('Workflows file unreadable') },
        h('h2', { text: t('The workflows file can’t be read') }),
        h('p', null, h('code', { text: b.path || 'workflows.json' })),
        b.message ? h('p', { class: 'notice-msg', text: b.message }) : null,
        h('p', { text: t('Workflows can’t be edited until it is fixed or replaced. Fix the file and reload, or start fresh.') }),
        h('div', { class: 'd-actions' },

          h('button', { type: 'button', class: 'btn', 'data-act': 'reload-workflows' }, t('Reload'))));
    }
    const msg = b.message || (b.status ? t('The server answered {status}.', { status: String(b.status) }) : t('The server did not answer.'));

      h('div', { class: 'd-actions' }, h('button', { type: 'button', class: 'btn', 'data-act': 'reload-workflows' }, t('Try again'))));

  function renderWorkflowEmpty() {

      h('h2', { text: t('Organize your skills into a workflow') }),
      h('p', { text: t('A workflow arranges skills into the phases of how you work — say Decide, Build, Verify, Ship — so you can see what runs when and how work passes between phases.') }),
      presets.length ? h('div', { class: 'presets' }, presets.map((p) => h('button', { type: 'button', class: 'preset-btn', 'data-act': 'preset-start', 'data-preset': p.id },
        h('b', { text: presetName(p) }), presetDescription(p) ? h('span', { text: presetDescription(p) }) : null,
        h('span', { class: 'phases', text: arr(p.phases).map((x, i) => presetPhaseName(p, i)).join(' → ') })))) : null,
      h('div', { class: 'd-actions' },

  function renderAddPhase() {
    if (state.grouping !== 'workflow' || !canEdit()) return null;
    return h('div', { class: 'add-phase-col' },
      h('button', { type: 'button', class: 'add-phase', 'data-act': 'add-phase', 'data-fk': 'add-phase' }, icon('plus'), t('Add phase')));
  }

  function pillsFor(cats, opts = {}) {
    const wrap = h('span', { class: 'pills' });
    for (const c of CATS) {
      const ids = cats[c];
      if (!ids.length) continue;
      const label = t('{category}: {tags}', { category: catLabel(c), tags: list(ids.map((id) => tagLabel(id))) });
      wrap.append(h('span', { class: `pill cat-${c}${opts.bare ? ' bare' : ''}`, role: 'img', 'aria-label': label, title: label }, icon(c), opts.bare ? null : fmtNum(ids.length)));
    }
    return wrap;
  }
  // A tag's label in the shown language: its label file's, else the rules', else, for a tag the
  // scan made from an MCP server's name, the page's own phrase.
  function tagLabel(id) {
    const own_ = labelText((labels().tags || {})[id]);
    if (own_) return own_;
    const tg = state.idx.tagById.get(id);
    // The server's name as the scan wrote it in the label; the id has it lowercased.
    const m = /^tool\.mcp-/.test(str(id)) && tg ? /^MCP: (.+)$/.exec(str(tg.label)) : null;
    if (m) return t('MCP: {server}', { server: m[1] });
    return tg ? tg.label : id;
  }
  // A name shared by several installed skills carries its folder's label, so the copies read apart.
  const isShared = (s) => (state.idx.byName.get(s.name) || []).length > 1;
  const rootLabel = (s) => { const r = state.idx.rootById.get(s.root); return r ? rootName(r) : str(s.root); };
  const skillLabel = (id) => { const s = state.idx.byId.get(id); return s ? '/' + s.name + (isShared(s) ? ' · ' + rootLabel(s) : '') : '/' + id; };

  // ---------- a skill's words in the shown language ----------
  // A translation supplies words only: steps, links and tags are always those of SKILL.md.
  // The tag of the skill's translation in the page's language: the page's own tag, else one of the
  // same language and script (matchLang: `zh` and `zh-Hans` serve zh-CN, `zh-TW` does not), or
  // null. Every read of a skill's translated words, its search text and its translation insights
  // goes through this one tag; a file is still asked for under the page's tag (the server matches alike).
  function trTag(s) {
    const c = s._trTag;
    if (c && c.lang === i18n.lang) return c.tag;
    const tag = matchLang(i18n.lang, Object.keys(s.translations));
    s._trTag = { lang: i18n.lang, tag };
    return tag;
  }
  function skillTr(s) {
    const tag = trTag(s);
    const tr = tag ? s.translations[tag] : null;
    return tr && typeof tr === 'object' ? tr : null;
  }
  // The language a text is written in, read from the script most of its letters are in. Han, kana
  // and hangul letters, each weighing as much as three letters of another script, outweighing the
  // Latin ones make it Japanese where kana are at least a tenth of the Han and kana, Korean where
  // hangul are most, else Chinese; Latin letters most make it English; letters of any other script
  // (Cyrillic, Arabic, Greek, Devanagari...) most make it unknown, `und`, which no page's language
  // is. So an English skill quoting a Chinese or Japanese example stays English.
  const HAN = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g;
  const KANA = /[\u3041-\u3096\u30A1-\u30FA\u31F0-\u31FF\uFF66-\uFF9D]/g; // letters only: no '・' or 'ー'
  const HANGUL = /[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF]/g;
  const LATIN = /\p{Script=Latin}/gu;
  const OTHER = /[^\P{L}\p{Script=Latin}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}\p{Script=Common}\p{Script=Inherited}]/gu;
  const CJK_WEIGHT = 3;
  const count = (text, re) => (text.match(re) || []).length;
  function textLang(text) {
    const han = count(text, HAN);
    const kana = count(text, KANA);
    const hangul = count(text, HANGUL);
    const cjk = CJK_WEIGHT * (han + kana + hangul), latin = count(text, LATIN), other = count(text, OTHER);
    if (other > latin && other > cjk) return 'und';
    if (cjk <= latin) return 'en';
    if (hangul > han + kana) return 'ko';
    return kana * 10 >= han + kana ? 'ja' : 'zh';
  }
  // The language SKILL.md names in its frontmatter's `metadata.language`, or ''.
  function declaredLang(s) {
    const meta = s.frontmatter && s.frontmatter.metadata;
    const declared = meta && typeof meta === 'object' ? str(meta.language).trim() : '';
    return /^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$/.test(declared) ? declared : '';
  }
  // The language a skill is written in: the one its SKILL.md declares, else its words'. The skill's
  // details ask this; the file dialog asks textLang of the file it shows [skill-atlas-29].
  function originalLang(s) {
    return declaredLang(s) || textLang([s.name, s.description, s.summary, ...s.steps.map((st) => st.title + '\n' + st.excerpt)].join('\n'));
  }
  // Whether two tags name one language: one primary subtag and one script (`zh-Hant` is not `zh-CN`'s).
  const sameLanguage = (a, b) => primary(a) === primary(b) && scriptOf(a) === scriptOf(b);
  // translated | original (no translation of its words: shown in its original, another language) |
  // same (no translation needed, as far as can be told). Words from annotations alone, with no
  // translated description, leave the skill in its original.
  function trState(s) {
    const tr = skillTr(s);
    if (tr && (str(tr.description) || (!str(s.description) && tr.origin !== 'annotation'))) return 'translated';
    return sameLanguage(originalLang(s), i18n.lang) ? 'same' : 'original';
  }
  // Whether the scan found the translation's steps numbering otherwise than the skill's.
  const trStepsDiffer = (s) => state.idx.insights.some((i) => i.kind === 'translation-steps' && arr(i.skills).includes(s.id) && i.params && trTag(s) != null && i.params.lang === trTag(s));
  const shownDesc = (s) => { const tr = skillTr(s); return (tr && str(tr.description)) || s.description; };
  const shownSummary = (s) => { const tr = skillTr(s); return (tr && str(tr.summary)) || s.summary; };
  function trSteps(s) {
    const tr = skillTr(s);
    return tr && Array.isArray(tr.steps) && tr.steps.length === s.steps.length ? tr.steps : null;
  }
  function stepWords(s, st) {
    const steps = trSteps(s);
    const w = steps && steps[st._pos] && typeof steps[st._pos] === 'object' ? steps[st._pos] : null;
    return {
      title: (w && str(w.title)) || st.title || t('Step {n}', { n: st.index }),
      excerpt: (w && str(w.excerpt || w.summary)) || st.excerpt,
    };
  }
  // The marks a reader sees where a skill is opened: shown in its original, a translation behind its
  // source, or one edited apart from it, which agents do not follow.
  function trNotes(s) {
    const st = trState(s);
    const out = [];
    const language = languageName(i18n.lang);
    const tr = skillTr(s);
    if (st === 'original') out.push(h('p', { class: 'tr-note', role: 'note', 'data-tr': 'original', text: t('Shown in its original language: there is no {language} translation.', { language }) }));
    if (st === 'translated' && tr.stale) out.push(h('p', { class: 'tr-note stale', role: 'note', 'data-tr': 'stale', text: t('The {language} translation may be behind its source.', { language }) }));
    if (st === 'translated' && tr.edited) out.push(h('p', { class: 'tr-note stale', role: 'note', 'data-tr': 'edited', text: t('The {language} translation was edited apart from its source; agents follow SKILL.md, not this text.', { language }) }));
    if (st === 'translated' && s.steps.length && !trSteps(s)) {
      out.push(trStepsDiffer(s)
        ? h('p', { class: 'tr-note', role: 'note', 'data-tr': 'steps', text: t('Steps are shown in the original: the translation’s steps do not match the skill’s.') })
        : h('p', { class: 'tr-note', role: 'note', 'data-tr': 'steps', text: t('Steps are shown in their original language.') }));
    }
    return out;
  }

  function renderGroup(g, colIndex) {
    const key = groupKey(g);
    const collapsed = state.collapsed.has(key);
    const visIds = g.ids.filter(isVisible);
    const countText = filtering() ? t('{shown} of {n}', { shown: visIds.length, n: g.ids.length }) : fmtNum(g.ids.length);
    const countLabel = filtering() ? t('{shown} of {n} skill shown|{shown} of {n} skills shown', { shown: visIds.length, n: g.ids.length }) : t('{n} skill|{n} skills', { n: g.ids.length });

  function renderMissing(name, g) {

  const stepNoun = (s, n) => (s.stepKind === 'section' ? t('{n} section|{n} sections', { n }) : t('{n} step|{n} steps', { n }));

      inPhase && editable ? h('button', { type: 'button', class: 'icon-btn', 'data-act': 'card-remove', 'data-skill': s.id, 'data-phase': g.id, 'data-fk': `cr|${key}|${s.id}`, 'aria-label': t('Remove {skill} from {phase}', { skill: '/' + s.name, phase: g.title }), title: t('Remove from {phase}', { phase: g.title }) }, icon('x')) : null);

    const inst = { el: card, card, group: false, col: colIndex, steps: new Map() };

  function renderSteps(s, key, stepsId, inst) {
    const wrap = h('div', { class: 'steps', id: stepsId });
    if (s.stepKind === 'none' || !s.steps.length) {
      wrap.append(h('div', { class: 'steps-none', text: t('No steps detected') }));
      return wrap;
    }
    wrap.append(h('div', { class: 'steps-head', text: stepsHeading(s) }));
    for (const st of s.steps) {
      const open = state.openSteps.has(st.id);
      const bodyId = 'sb-' + (++uid);
      const words = stepWords(s, st);
      const stepCats = rollupIds(new Set(st.tags.map((tg) => tg.id)), state.idx.tagById);
      const row = h('div', { class: 'step' + (open ? ' open' : ''), 'data-step': st.id });
      const line = h('div', { class: 'step-line' });
      line.append(h('button', { type: 'button', class: 'step-main', 'data-act': 'step', 'data-step': st.id, 'data-fk': `step|${key}|${st.id}`, 'aria-expanded': String(open), 'aria-controls': open ? bodyId : null },
        h('span', { class: 'step-idx', text: fmtNum(st.index) }),
        h('span', { class: 'step-title', title: words.title, text: words.title }),
        h('span', { class: 'step-tags' }, pillsFor(stepCats, { bare: true }))));
      // A link the reader hides (a mention, with Mentions off) shows no chip.
      const shownCalls = st.calls.filter((to) => { const k = st.id + '\u0000' + to; return state.derived.stepKind.has(k) || !state.idx.stepEdgeKind.has(k); });
      if (shownCalls.length) {
        const calls = h('span', { class: 'step-calls' });
        for (const to of shownCalls) {
          const target = state.idx.byId.get(to);
          if (target) {
            const kind = state.derived.stepKind.get(st.id + '\u0000' + to) || 'calls';
            const tip = kind === 'mentions' ? t('Mentions {skill} — go there', { skill: '/' + target.name }) : t('Calls {skill} — go there', { skill: '/' + target.name });
            calls.append(h('button', { type: 'button', class: 'call-chip' + (kind === 'mentions' ? ' mention' : ''), 'data-act': 'follow', 'data-to': to, 'data-fk': `cc|${key}|${st.id}|${to}`, title: tip }, `→ ${target.name}`));
          } else {
            calls.append(h('span', { class: 'call-chip unresolved', title: t('{skill} is not installed', { skill: to }) }, `→ ${to}`));
          }

        line.append(calls);
      }
      row.append(line);
      if (open) row.append(renderStepBody(st, words, bodyId));
      wrap.append(row);
      inst.steps.set(st.id, line);
    }
    return wrap;
  }

  function renderStepBody(st, words, bodyId) {
    const body = h('div', { class: 'step-body', id: bodyId });
    if (st.line) body.append(h('div', { class: 'lines', text: st.endLine && st.endLine !== st.line ? t('Lines {from}–{to}', { from: st.line, to: st.endLine }) : t('Line {n}', { n: st.line }) }));
    if (words.excerpt) body.append(h('p', { class: 'excerpt', text: words.excerpt }));
    for (const tg of st.tags) body.append(renderTagEvidence(tg));
    if (!words.excerpt && !st.tags.length) body.append(h('span', { class: 'muted', text: t('No text or tags in this step.') }));
    return body;
  }

  const TAG_SOURCES = { frontmatter: () => t('from frontmatter'), annotation: () => t('from annotation') };
  // A tag with its evidence: the lines it was matched on, quoted from SKILL.md as they stand.
  function renderTagEvidence(tg) {
    const c = CATS.includes(tg.category) ? tg.category : catOf(tg.id);
    const from = tg.source && tg.source !== 'rule' ? (own(TAG_SOURCES, tg.source) ? TAG_SOURCES[tg.source]() : t('from {source}', { source: str(tg.source) })) : '';
    return h('div', { class: 'ev-tag' },
      h('span', null, h('span', { class: `tagchip cat-${c}`, title: catLabel(c) }, icon(c), tagLabel(tg.id) || str(tg.label)),
        from ? h('span', { class: 'src-badge', text: ' ' + from }) : null),
      tg.evidence.length ? h('ul', { class: 'ev' }, tg.evidence.map((e) => h('li', null, h('span', { class: 'ln', text: e.line ? t('L{n}', { n: e.line }) : '' }), h('span', { class: 'tx', text: str(e.text) })))) : null);
  }

  // ===================================================================
  // Links overlay
  // ===================================================================
  let linkEls = [];
  const elIds = new WeakMap();
  let elSeq = 0;
  const elId = (el) => { let v = elIds.get(el); if (!v) { v = ++elSeq; elIds.set(el, v); } return v; };

  function drawLinks() {
    const layer = els.layer;
    layer.replaceChildren();
    linkEls = [];
    const board = els.board;
    els.svg.setAttribute('width', board.scrollWidth);
    els.svg.setAttribute('height', board.scrollHeight);
    if (!anchors.size) return;
    const bRect = board.getBoundingClientRect();
    const rects = new Map();
    const rectOf = (el) => {
      let r = rects.get(el);
      if (!r) {
        const c = el.getBoundingClientRect();
        r = { l: c.left - bRect.left, r: c.right - bRect.left, t: c.top - bRect.top, b: c.bottom - bRect.top, cy: c.top - bRect.top + Math.min(c.height / 2, 18) };
        rects.set(el, r);
      }
      return r;
    };
    const agg = new Map();
    for (const e of state.derived.shown) {
      if (e.from === e.to || !isVisible(e.from) || !isVisible(e.to)) continue;
      const srcs = anchors.get(e.from), tgts = anchors.get(e.to);
      if (!srcs || !tgts) continue;
      let best = null, bestD = Infinity;
      for (const s of srcs) {
        const sEl = !s.group && e.fromStep && state.expanded.has(e.from) && s.steps.get(e.fromStep) ? s.steps.get(e.fromStep) : s.el;
        const a = rectOf(sEl);
        for (const tt of tgts) {
          if (tt.el === s.el) continue;
          const b = rectOf(tt.el);
          const dist = Math.abs((a.l + a.r) / 2 - (b.l + b.r) / 2) + Math.abs(a.cy - b.cy) * 0.35 + (b.l < a.l ? 40 : 0);
          if (dist < bestD) { bestD = dist; best = { sEl, tEl: tt.el }; }
        }
      }
      if (!best || best.sEl === best.tEl) continue;
      const k = elId(best.sEl) + '>' + elId(best.tEl) + ':' + e.kind;
      let L = agg.get(k);
      if (!L) { L = { sEl: best.sEl, tEl: best.tEl, kind: e.kind, n: 0, skills: new Set() }; agg.set(k, L); }
      L.n++;
      L.skills.add(e.from); L.skills.add(e.to);
    }
    const NS = 'http://www.w3.org/2000/svg';
    const frag = document.createDocumentFragment();
    // Mentions first so calls paint on top.
    const list = [...agg.values()].sort((x, y) => (x.kind === y.kind ? 0 : x.kind === 'mentions' ? -1 : 1));
    // Pick the side each end attaches to, then spread the ends sharing one side of one element
    // ("ports") down that side in the order of their other ends, so parallel links stay apart.
    const ports = new Map();
    const port = (el, side, L, end, otherY) => {
      const k = elId(el) + side;
      if (!ports.has(k)) ports.set(k, { el, list: [] });
      ports.get(k).list.push({ L, end, otherY });
    };
    for (const L of list) {
      const a = rectOf(L.sEl), b = rectOf(L.tEl);
      if (b.l >= a.r + 6) L.dir = 'r'; else if (b.r <= a.l - 6) L.dir = 'l'; else L.dir = 's';
      L.y1 = a.cy; L.y2 = b.cy;
      port(L.sEl, L.dir === 'l' ? 'l' : 'r', L, 's', b.cy);
      port(L.tEl, L.dir === 'r' ? 'l' : 'r', L, 't', a.cy);
    }
    for (const { el, list: ends } of ports.values()) {
      if (ends.length < 2) continue;
      const r = rectOf(el);
      const top = r.t + 8, span = Math.min(r.b - r.t, 72) - 16;
      if (span < 12) continue;
      ends.sort((x, y) => x.otherY - y.otherY);
      ends.forEach((e, k) => { const y = top + (span * (k + 1)) / (ends.length + 1); if (e.end === 's') e.L.y1 = y; else e.L.y2 = y; });
    }
    let skipN = 0;
    for (const L of list) {
      const a = rectOf(L.sEl), b = rectOf(L.tEl);
      const y1 = L.y1, y2 = L.y2;
      let x1, x2, d, mx;
      // Between collapsed groups that skip a column, dip under the row of group cards so the
      // link can't be mistaken for one ending at the card it would otherwise pass beneath.
      const skip = L.sEl.classList.contains('group-card') && L.tEl.classList.contains('group-card') && Math.abs((a.l + a.r) / 2 - (b.l + b.r) / 2) > (a.r - a.l) * 1.6;
      const dip = skip ? Math.max(a.b, b.b) + 26 + (skipN++ % 5) * 7 : 0;
      if (L.dir === 'r') {
        x1 = a.r; x2 = b.l - 1;
        const dx = Math.max(24, (x2 - x1) * 0.45);
        d = skip ? `M${x1} ${y1} C${x1 + 40} ${y1} ${x1 + 20} ${dip} ${x1 + 60} ${dip} L${x2 - 60} ${dip} C${x2 - 20} ${dip} ${x2 - 40} ${y2} ${x2} ${y2}`
          : `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
        mx = x2 - 20;
      } else if (L.dir === 'l') {
        x1 = a.l; x2 = b.r + 1;
        const dx = Math.max(24, (x1 - x2) * 0.45);
        d = skip ? `M${x1} ${y1} C${x1 - 40} ${y1} ${x1 - 20} ${dip} ${x1 - 60} ${dip} L${x2 + 60} ${dip} C${x2 + 20} ${dip} ${x2 + 40} ${y2} ${x2} ${y2}`
          : `M${x1} ${y1} C${x1 - dx} ${y1} ${x2 + dx} ${y2} ${x2} ${y2}`;
        mx = x2 + 20;
      } else {
        // Same column: bow out into the gutter on the right.
        x1 = a.r; x2 = b.r + 1;
        const bow = 16 + Math.min(14, Math.abs(y2 - y1) * 0.04);
        d = `M${x1} ${y1} C${x1 + bow} ${y1} ${x2 + bow} ${y2} ${x2} ${y2}`;
        mx = x2 + 14;
      }
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'lk ' + L.kind);
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('class', 'ln');
      p.setAttribute('d', d);
      g.append(p);
      if (L.n > 1) {
        // The count sits in the gutter just before the target, where links to one target converge.
        const my = L.dir === 's' ? (y1 + y2) / 2 : y2;
        const label = document.createElementNS(NS, 'g');
        label.setAttribute('class', 'cnt');
        const txt = '×' + L.n, w = 8 + txt.length * 6;
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', mx - w / 2); r.setAttribute('y', my - 8); r.setAttribute('width', w); r.setAttribute('height', 16); r.setAttribute('rx', 8);
        const te = document.createElementNS(NS, 'text');
        te.setAttribute('x', mx); te.setAttribute('y', my + 3.5); te.setAttribute('text-anchor', 'middle');
        te.textContent = txt;
        label.append(r, te);
        g.append(label);
      }
      frag.append(g);
      linkEls.push({ el: g, skills: L.skills });
    }
    layer.append(frag);
    applyEmphasis();
  }

  // ===================================================================
  // Selection and emphasis (class toggles only; no re-render)
  // ===================================================================
  let markedCards = [];
  function activeSet() {
    if (state.hover) return new Set([state.hover]);
    const sel = state.selection;
    if (sel && sel.type === 'skill') return new Set([sel.id]);
    if (sel && sel.type === 'phase') { const p = findPhase(sel.id); return p ? new Set(p.skills) : null; }
    if (state.highlight.size) return state.highlight;
    return null;
  }
  function applyEmphasis() {
    const act = activeSet();
    els.svg.classList.toggle('emph', !!act && linkEls.length > 0);
    for (const L of linkEls) {
      let hot = false;
      if (act) for (const id of L.skills) if (act.has(id)) { hot = true; break; }
      L.el.classList.toggle('hot', hot);
    }
    for (const el of markedCards) el.classList.remove('nb');
    markedCards = [];
    if (act && act.size === 1) {
      const [id] = act;
      const nb = new Set([...(state.derived.out.get(id) || []), ...(state.derived.inc.get(id) || [])]);
      for (const n of nb) for (const inst of anchors.get(n) || []) if (!inst.group) { inst.card.classList.add('nb'); markedCards.push(inst.card); }
    }
  }
  function syncSelection() {
    const sel = state.selection;
    for (const el of els.board.querySelectorAll('.card.selected, .card.hl, .col.selected')) el.classList.remove('selected', 'hl');
    if (sel && sel.type === 'skill') for (const inst of anchors.get(sel.id) || []) if (!inst.group) inst.card.classList.add('selected');

    for (const id of state.highlight) for (const inst of anchors.get(id) || []) if (!inst.group) inst.card.classList.add('hl');
    applyEmphasis();
  }

  function select(sel, opts = {}) {
    state.selection = sel;

    invalidate('chrome', 'details', 'links');
  }

  // Follow a link: reveal the target (clear filters, expand its group), select, scroll, flash.
  function follow(id, opts = {}) {
    const idx = state.idx;
    if (!idx.byId.has(id)) return;
    if (!isVisible(id)) {
      setSearch(''); state.tagFilter.clear(); state.focus = null; recompute();
      toast(t('Cleared filters to show {skill}', { skill: skillLabel(id) }));
    }
    if (state.grouping === 'workflow' && !activeWorkflow()) state.grouping = 'links';
    const groups = computeGroups() || [];
    const containing = groups.filter((g) => g.ids.includes(id));
    if (containing.length && containing.every((g) => state.collapsed.has(groupKey(g)))) state.collapsed.delete(groupKey(containing[0]));
    if (opts.expand) state.expanded.add(id);
    if (opts.openStep) state.openSteps.add(opts.openStep);
    state.selection = { type: 'skill', id };
    if (!opts.keepHighlight) state.highlight = new Set();
    state.detailsOpen = true;
    savePrefs();
    invalidate('chrome', 'canvas', 'details');
    flush();
    const inst = (anchors.get(id) || []).find((x) => !x.group);
    if (!inst) return;
    const target = opts.openStep && inst.steps.get(opts.openStep) ? inst.steps.get(opts.openStep) : inst.card;
    target.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
    inst.card.classList.remove('flash');
    void inst.card.offsetWidth;
    inst.card.classList.add('flash');
    setTimeout(() => inst.card.classList.remove('flash'), 1400);
    if (opts.focusCard) inst.card.querySelector('.card-main')?.focus({ preventScroll: true });
  }

  // ===================================================================

  function renderDetails() {

    let content;
    if (sel && sel.type === 'skill' && state.idx.byId.has(sel.id)) content = renderSkillDetails(state.idx.byId.get(sel.id));
    else if (sel && sel.type === 'phase' && findPhase(sel.id)) content = renderPhaseDetails(findPhase(sel.id));
    else content = renderDetailsEmpty();
    panel.replaceChildren(...content);

  }

    if (s.tags.length || s._tagIds.size) {
      const tagSec = sec(t('Tags'));
      const byCat = new Map(CATS.map((c) => [c, []]));
      const seen = new Set();
      for (const tg of s.tags) { byCat.get(CATS.includes(tg.category) ? tg.category : catOf(tg.id)).push(tg); seen.add(tg.id); }

        live ? h('button', { type: 'button', class: 'linkish', 'data-act': 'view-file', 'data-skill': s.id, 'data-path': str(f.path) }, str(f.path)) : h('span', { class: 'fname', text: str(f.path) }),
        h('span', { class: 'kind', text: fileKind(f.kind) }),

  function linkList(edges, side, s) {

        h('span', { class: 'top' }, h('button', { type: 'button', class: 'linkish mono', 'data-act': 'follow', 'data-to': o, text: skillLabel(o) }),
