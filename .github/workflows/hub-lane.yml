# The hub's privileged lane on CI (release-36, DR-149): hub-10 run as
# root on GitHub's Ubuntu runner — a disposable Linux host booted by
# systemd with passwordless sudo — from the commit's tree unpacked
# outside any home, as apps/hub/deploy/LANE.md has it by hand. It runs
# on the nightly schedule, on a push to main that touches the hub or the
# server shell it runs, on a pull request that changes this workflow
# itself, and on request; it is no required check of a pull request
# (DR-145). The lane's output, redacted of every secret, is the run's
# artifact.
name: Hub Lane

on:
  schedule:
    # Half an hour after CI's nightly, so the two never share a minute.
    - cron: '47 3 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/hub/**'
      - 'apps/server/**'
      - '.github/workflows/hub-lane.yml'
  # A change to the lane's own workflow is exercised before it merges;
  # no other pull request runs the lane.
  pull_request:
    paths:
      - '.github/workflows/hub-lane.yml'
  workflow_dispatch:

# One lane at a time per ref; a push to main cancels nothing.
concurrency:
  group: hub-lane-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHECKOUT: /usr/local/src/spex
  LANE_LOGS: /root/lane-logs

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # install.sh runs node as root, as the hub's account and as every
      # seat's, so node must lie where root alone may write (hub-7); the
      # runner's toolcache belongs to the runner account. The newest
      # Node 22 — the hub's floor and the CI matrix's first version — is
      # taken from nodejs.org, checked against its signed sums, unpacked
      # under /opt/nodejs and linked from /usr/bin, which the units name,
      # and from /usr/local/bin, which sudo's PATH reads first.
      - name: Node 22 under root's own directories
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://nodejs.org/dist/index.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).find((release) => release.version.startsWith("v22.")).version')
          test -n "$version"
          dist="https://nodejs.org/dist/$version"
          tarball="node-$version-linux-x64.tar.xz"
          curl -fsSLO "$dist/$tarball"
          curl -fsSLO "$dist/SHASUMS256.txt"
          sha256sum --check --ignore-missing SHASUMS256.txt
          sudo install -d -m 0755 -o root -g root /opt/nodejs
          sudo tar -xJf "$tarball" -C /opt/nodejs --no-same-owner
          for tool in node npm npx; do
            sudo ln -sfn "/opt/nodejs/node-$version-linux-x64/bin/$tool" "/usr/bin/$tool"
            sudo ln -sfn "/opt/nodejs/node-$version-linux-x64/bin/$tool" "/usr/local/bin/$tool"
          done
          rm -f "$tarball" SHASUMS256.txt
          sudo -n node -p 'process.version'
          test "$(sudo -n sh -c 'command -v node')" = /usr/local/bin/node
          test "$(readlink -f /usr/local/bin/node)" = "/opt/nodejs/node-$version-linux-x64/bin/node"

      # A release checkout outside any home, as LANE.md unpacks one.
      - name: The commit's tree outside any home
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o root -g root "$CHECKOUT"
          git archive --format=tar HEAD | sudo tar -x --no-same-owner -C "$CHECKOUT"

      - name: The privileged lane (hub-10)
        run: sudo -n env LANE_COMMIT="$GITHUB_SHA" LANE_LOGS="$LANE_LOGS" "$CHECKOUT/apps/hub/scripts/privileged-lane.sh"

      - name: Keep the lane's output
        if: always()
        run: |
          set -euo pipefail
          if sudo test -d "$LANE_LOGS"; then
            sudo cp -r "$LANE_LOGS" "$RUNNER_TEMP/lane-logs"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/lane-logs"
          else
            mkdir -p "$RUNNER_TEMP/lane-logs"
            echo "the lane wrote no log" > "$RUNNER_TEMP/lane-logs/none.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-lane-log
          path: ${{ runner.temp }}/lane-logs/
          retention-days: 14
