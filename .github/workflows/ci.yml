name: CI

# PRs validate the affected workspaces. Release callers and explicit full
# runs validate their exact commit across platforms (DR-199).
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      channel:
        type: string
        default: app
      release-tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      full:
        description: Run full release validation
        type: boolean
        default: true
      channel:
        description: Release channel to validate
        type: choice
        options: [app, cli]
        default: app

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      affected: ${{ steps.classify.outputs.affected }}
      # GitHub omits empty job outputs; JSON preserves the scripts-only plan.
      affected-json: ${{ toJSON(steps.classify.outputs.affected) }}
      full: ${{ steps.classify.outputs.full }}
      channel: ${{ steps.classify.outputs.channel }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-version.mjs prepare
      - id: classify
        shell: bash
        env:
          FULL: ${{ inputs.full || false }}
          CHANNEL: ${{ inputs.channel || 'app' }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          case "$CHANNEL" in app|cli) ;; *) echo 'Unknown validation channel' >&2; exit 1 ;; esac
          printf '%s\n' "full=$FULL" "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = true ]; then
            affected=all
            if [ "$CHANNEL" = cli ]; then affected=packages/cli; fi
            printf '%s\n' docs-only=false "affected=$affected" >> "$GITHUB_OUTPUT"
          else
            node scripts/affected-tests.mjs --base "origin/$BASE" --github-output | tee -a "$GITHUB_OUTPUT"
          fi
      - id: matrix
        env:
          CI_FULL: ${{ steps.classify.outputs.full }}
          CI_AFFECTED: ${{ steps.classify.outputs.affected }}
        run: node scripts/ci-verdict.mjs --matrix >> "$GITHUB_OUTPUT"
      - name: Require published runtime dependencies before app validation
        if: steps.classify.outputs.full == 'true' && steps.classify.outputs.channel == 'app'
        run: node scripts/dependency-closure.mjs --registry-only
      - name: Documentation alone keeps the spec gates
        if: steps.classify.outputs.docs-only == 'true'
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          npm ci
          npm run build -w packages/cli
          node scripts/affected-tests.mjs --base "origin/$BASE" --run

  test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Prepare release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-version.mjs prepare
      - run: npm ci
      - name: Build, catalogs, types and specifications
        shell: bash
        run: |
          npm run build
          node packages/cli/dist/cli.js lint
          npm run typecheck -w e2e
      - name: Require Git LFS for real transport and local Apply coverage
        if: runner.os != 'Windows' && (needs.changes.outputs.affected == 'all' || contains(needs.changes.outputs.affected, 'packages/core'))
        run: git lfs version
      - name: Tests the change reaches
        if: runner.os != 'Windows'
        run: node scripts/affected-tests.mjs --run "${{ needs.changes.outputs.affected }}"
      - name: Windows scaffold tests
        if: runner.os == 'Windows' && (needs.changes.outputs.affected == 'all' || contains(needs.changes.outputs.affected, 'packages/cli'))
        run: npm test -w packages/cli
      - name: Windows UI tests
        if: runner.os == 'Windows' && (needs.changes.outputs.affected == 'all' || contains(needs.changes.outputs.affected, 'packages/ui'))
        run: npm test -w packages/ui
      - name: Windows native storage and unsupported-host refusal
        if: runner.os == 'Windows' && (needs.changes.outputs.affected == 'all' || contains(needs.changes.outputs.affected, 'packages/core'))
        run: node --test packages/core/dist/platform.integration.test.js packages/core/dist/windows-storage.integration.test.js packages/core/dist/compile-module-scope.integration.test.js
      - name: Windows store removal on the app's Node
        if: runner.os == 'Windows' && (needs.changes.outputs.affected == 'all' || contains(needs.changes.outputs.affected, 'packages/core'))
        shell: bash
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" --test packages/core/dist/store-removal.integration.test.js

  journeys:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.full == 'true' && needs.changes.outputs.channel == 'app'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Select the owned served browser cache
        shell: bash
        run: printf '%s\n' "SPEX_E2E_BROWSER_CACHE=$RUNNER_TEMP/spex served managed browser cache" >> "$GITHUB_ENV"

      # The authoring journeys compile with a stub slc under this Node,
      # which stands in for the system Node the compile floor checks
      # (DR-005: >= 23.6); an older Node fails every compile "at
      # toolchain" before the compiler runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-version.mjs prepare
      - run: npm ci
      - run: npm run build

      # Chromium's system libraries are an apt install on Linux; macOS
      # needs none.
      - name: Chromium and its system libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Managed Chromium sandbox prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Resolve the exact Playwright copy that Cligent's pinned MCP uses.
          managed_chromium=$(PLAYWRIGHT_BROWSERS_PATH="$SPEX_E2E_BROWSER_CACHE" node --input-type=module -e "import {createRequire} from 'node:module'; const c=createRequire(import.meta.resolve('@sublang/cligent')); const m=createRequire(c.resolve('@playwright/mcp/package.json')); console.log(m('playwright').chromium.executablePath())")
          cat > "$RUNNER_TEMP/spex-browser-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile spex-ci-managed-chromium "$managed_chromium" flags=(unconfined) {
            userns,
          }
          EOF
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          sudo apparmor_parser -r "$RUNNER_TEMP/spex-browser-apparmor"

      - name: Browser journeys
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-report-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  desktop-browser:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.full == 'true' && needs.changes.outputs.channel == 'app'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select separate owned source and packaged browser caches
        shell: bash
        run: |
          printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/spex managed browser cache" >> "$GITHUB_ENV"
          printf '%s\n' "SPEX_PACKAGED_BROWSER_CACHE=$RUNNER_TEMP/spex packaged managed browser cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-version.mjs prepare
      - run: npm ci
      - run: npm run build
      - name: Install Electron and native browser libraries
        shell: bash
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          if [ "$RUNNER_OS" = Linux ]; then
            managed_cli=$(node --input-type=module -e "import {createRequire} from 'node:module'; import {join,dirname} from 'node:path'; const c=createRequire(import.meta.resolve('@sublang/cligent')); const m=createRequire(c.resolve('@playwright/mcp/package.json')); console.log(join(dirname(m.resolve('playwright/package.json')), 'cli.js'))")
            node "$managed_cli" install-deps chromium
          fi
      - run: npm run rebuild:electron -w apps/desktop
      - name: Build local packaged app with a physical child dependency tree
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then target=mac; else target=linux; fi
          node_modules/.bin/electron-builder --projectDir apps/desktop --dir "--$target" --config.mac.identity=null --config.mac.forceCodeSigning=false --config.executableName=spex-browser-acceptance --config.directories.output="$RUNNER_TEMP/spex browser packaged"
      - name: Permit only the native CI executables to use sandbox namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          managed_chromium=$(node --input-type=module -e "import {createRequire} from 'node:module'; const c=createRequire(import.meta.resolve('@sublang/cligent')); const m=createRequire(c.resolve('@playwright/mcp/package.json')); console.log(m('playwright').chromium.executablePath())")
          packaged_chromium=$(PLAYWRIGHT_BROWSERS_PATH="$SPEX_PACKAGED_BROWSER_CACHE" node --input-type=module -e "import {createRequire} from 'node:module'; const c=createRequire(import.meta.resolve('@sublang/cligent')); const m=createRequire(c.resolve('@playwright/mcp/package.json')); console.log(m('playwright').chromium.executablePath())")
          source_electron=$(node -p "require('electron')")
          packaged_app="$RUNNER_TEMP/spex browser packaged/linux-unpacked/spex-browser-acceptance"
          cat > "$RUNNER_TEMP/spex-desktop-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile spex-ci-desktop-chromium "$managed_chromium" flags=(unconfined) {
            userns,
          }
          profile spex-ci-packaged-chromium "$packaged_chromium" flags=(unconfined) {
            userns,
          }
          profile spex-ci-source-electron "$source_electron" flags=(unconfined) {
            userns,
          }
          profile spex-ci-packaged-electron "$packaged_app" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/spex-desktop-apparmor"
      - name: Verify native source and packaged UI browser setup without credentials
        shell: bash
        run: |
          packaged_app=$(find "$RUNNER_TEMP/spex browser packaged" -type f -name spex-browser-acceptance)
          test -n "$packaged_app"
          if [ "$RUNNER_OS" = Linux ]; then
            SPEX_BROWSER_REQUIRE_EMPTY_CACHE=1 xvfb-run -a npm run test:browser-host
            PLAYWRIGHT_BROWSERS_PATH="$SPEX_PACKAGED_BROWSER_CACHE" SPEX_BROWSER_REQUIRE_EMPTY_CACHE=1 SPEX_BROWSER_APP_EXECUTABLE="$packaged_app" xvfb-run -a npm run test:browser-host
          else
            SPEX_BROWSER_REQUIRE_EMPTY_CACHE=1 npm run test:browser-host
            PLAYWRIGHT_BROWSERS_PATH="$SPEX_PACKAGED_BROWSER_CACHE" SPEX_BROWSER_REQUIRE_EMPTY_CACHE=1 SPEX_BROWSER_APP_EXECUTABLE="$packaged_app" npm run test:browser-host
          fi

  hub-lane:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.full == 'true' && needs.changes.outputs.channel == 'app'
    uses: ./.github/workflows/hub-lane.yml
    with:
      release-tag: ${{ inputs.release-tag || '' }}
    permissions:
      contents: read

  # One stable required check verifies every selected job, including when
  # a failed dependency would otherwise make a dependent job look skipped.
  checks:
    if: always()
    needs: [changes, test, journeys, desktop-browser, hub-lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-verdict.mjs
