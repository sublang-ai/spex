# The cache seed (release-50, DR-228, DR-230). A pull request restores
# caches saved under its own merge ref or under `main`, never another
# pull request's, and CI runs on no push to `main` (DR-199), so this is
# what saves npm's package cache and Electron's and dugite's archives
# under `main` for every pull request and release to restore. It
# installs and fetches only: no build, no suite, no check.
#
# A job saves its caches only when it succeeds, and only what a
# successful step verified belongs in a cache. So the install and
# Electron's fetch are jobs of their own: the install's success, which
# verified dugite's archive, saves npm's cache and that archive; the
# fetch's success, which verified Electron's archive, saves that one.
# Neither waits on the other's downloads, and each retries its own.
name: Caches

on:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - .github/workflows/caches.yml
      - .github/actions/download-caches/action.yml
  workflow_dispatch:

# A newer push supersedes a seed still running; its own seed saves.
concurrency:
  group: caches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A request may name any ref, but caches saved there serve no pull
  # request or release (release-50): refuse it before any platform runs.
  ref:
    runs-on: ubuntu-latest
    steps:
      - name: Seed only under main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::The cache seed saves caches only under main, where pull requests and releases restore them; dispatch it on main, not '${REF}'."
            exit 1
          fi

  # npm's package cache and dugite's Git archive, which `npm ci` fetches
  # and verifies against its checksum.
  install:
    needs: ref
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/download-caches
      - name: Install, retrying a failed download
        shell: bash
        env:
          RETRY_SECONDS: 60
        run: |
          # Between tries, dugite's cache keeps only an archive matching the
          # locked dugite's checksum: what a download cut short left behind
          # would fail the next try's unpacking, while an archive restored
          # or fetched whole must survive another package's failure. npm
          # may roll the whole install back once any package's script
          # fails, taking the project's dugite with it, so before any try
          # the locked dugite is also installed apart, from the registry or
          # npm's cache and without its scripts.
          version=$(node -p 'require("./package-lock.json").packages["node_modules/dugite"].version')
          locked="$RUNNER_TEMP/dugite-locked"
          prune='
            const { createHash } = require("node:crypto");
            const { existsSync, readdirSync, readFileSync, rmSync } = require("node:fs");
            const { join } = require("node:path");
            const dir = process.env.DUGITE_CACHE_DIR;
            let checksum;
            for (const root of [process.argv[1], process.cwd()]) {
              try { checksum = require(join(root, "node_modules/dugite/script/config.js"))().checksum; break; } catch {}
            }
            if (!checksum) {
              console.log("::warning::No dugite checksum to check its cache against; keeping it as it is.");
              process.exit(0);
            }
            for (const name of existsSync(dir) ? readdirSync(dir) : []) {
              if (createHash("sha256").update(readFileSync(join(dir, name))).digest("hex") === checksum) continue;
              rmSync(join(dir, name), { recursive: true, force: true });
              console.log(`Dropped ${name} from the dugite cache: it fails the locked checksum.`);
            }'
          for attempt in 1 2 3; do
            [ -f "$locked/node_modules/dugite/script/config.js" ] ||
              npm install --prefix "$locked" --no-save --ignore-scripts --no-audit --no-fund --prefer-offline "dugite@$version" > /dev/null ||
              echo "::warning::The locked dugite could not be installed apart (attempt $attempt of 3)."
            # Checked just before each retry, with the newest checksum
            # there is, so a copy installed only now still guards this try.
            [ "$attempt" = 1 ] || node -e "$prune" "$locked"
            npm ci && exit 0
            [ "$attempt" = 3 ] && break
            echo "::warning::npm ci failed (attempt $attempt of 3); retrying in $((attempt * RETRY_SECONDS))s"
            sleep $((attempt * RETRY_SECONDS))
          done
          exit 1

  # Electron's archive, which its installer fetches and verifies against
  # the checksums Electron's package ships.
  electron:
    needs: ref
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No npm cache here: an install without its scripts would save one
      # lacking what those scripts fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/download-caches
      # The installer's packages from the registry; no GitHub release.
      - run: npm ci --ignore-scripts
      - name: Fetch Electron into its cache, retrying a failed download
        shell: bash
        env:
          RETRY_SECONDS: 60
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            [ "$attempt" = 3 ] && break
            echo "::warning::Electron's download failed (attempt $attempt of 3); retrying in $((attempt * RETRY_SECONDS))s"
            sleep $((attempt * RETRY_SECONDS))
          done
          exit 1
