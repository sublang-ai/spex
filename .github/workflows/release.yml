name: Release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate release tag to validate without publishing
        type: string
        required: true

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The cli-v* release channel ships only the CLI; skip Electron binaries.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create local candidate tag for branch validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs check --tag="$RELEASE_TAG" --channel=cli
          git -c tag.gpgsign=false tag "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Prepare version from tag
        id: version
        run: node scripts/release-version.mjs prepare --channel=cli
      - name: Generate release notes and reject duplicate versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes.mjs notes --tag="$RELEASE_TAG" --repository="$GITHUB_REPOSITORY" --out=release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-notes
          path: release-notes.md
          if-no-files-found: error

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true
      channel: cli
      release-tag: ${{ inputs.tag || github.ref_name }}

  release:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history + tags: the file-history audit (SCAF-21) checks
      # the manifest against every released tag; a shallow tag
      # checkout would make historical entries look unreleased.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.8.0

      - name: Prepare version from tag
        run: node scripts/release-version.mjs prepare --channel=cli
      - run: npm ci
      - run: npm run build -w packages/cli

      - name: Pack the validated CLI
        run: npm pack -w packages/cli --ignore-scripts --json > packed.json
      - name: Verify the actual tarball version and contents
        id: packed
        run: node scripts/release-artifacts.mjs npm --pack=packed.json
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-notes
          path: notes

      - uses: actions/upload-artifact@v4
        with:
          name: verified-cli-tarball
          path: ${{ steps.packed.outputs.tarball }}
          if-no-files-found: error
      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
        # Full validation already passed for this tagged tree; its CLI build
        # above supplies the tarball without repeating prepublishOnly's tests.
        env:
          TARBALL: ${{ steps.packed.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Spex CLI v${{ needs.prepare.outputs.version }}
          body_path: notes/release-notes.md
