name: Release

on:
  push:
    tags:
      - "cli-v*"

permissions: {}

env:
  # The cli-v* release channel ships only the CLI; skip Electron binaries.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true
      channel: cli

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history + tags: the file-history audit (SCAF-21) checks
      # the manifest against every released tag; a shallow tag
      # checkout would make historical entries look unreleased.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.8.0

      - run: npm ci
      - run: npm run build -w packages/cli

      - name: Validate tarball
        run: |
          npm pack --dry-run -w packages/cli 2>&1 | tee /tmp/pack-output.txt
          if grep -E '\.test\.(js|d\.ts)' /tmp/pack-output.txt; then
            echo "::error::Tarball contains test files"
            exit 1
          fi

      - name: Verify version matches tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match packages/cli/package.json $PKG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          # Extract section between ## [VERSION] and next ## [
          sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p}" packages/cli/CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No release notes found for version ${VERSION} in packages/cli/CHANGELOG.md"
            exit 1
          fi

      - name: Publish to npm
        # Full validation already passed for this tagged tree; its CLI build
        # above supplies the tarball without repeating prepublishOnly's tests.
        run: npm publish -w packages/cli --provenance --access public --ignore-scripts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Spex CLI v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
