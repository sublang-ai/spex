name: App Release

# The app channel (DR-040): an app-v* tag releases the desktop and
# server shells as source — a GitHub release carrying the changelog
# notes and the run-from-source instructions, no build artifacts.
# A beta (DR-087) is tagged app-vMAJOR.MINOR.PATCH-beta.N and released
# as a pre-release whose notes are the changelog's [Unreleased] section
# at the tag; a tag with any other pre-release identifier or build
# metadata is refused.

on:
  push:
    tags:
      - "app-v*"

permissions: {}

env:
  # Nothing here launches Electron: the release is source only.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  require-ci-green:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require CI to be green for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI (ci.yml) to succeed for commit $SHA"
          for attempt in $(seq 1 60); do
            line="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '(.workflow_runs[0].status // "missing") + " " + (.workflow_runs[0].conclusion // "none")')"
            status="${line%% *}"
            conclusion="${line##* }"
            echo "attempt $attempt/60: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green for $SHA."
                exit 0
              fi
              echo "::error::CI for $SHA concluded '$conclusion'; refusing to release."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI to complete for $SHA; refusing to release."
          exit 1

  release:
    needs: require-ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history: the CLI's file-history guard, part of npm test,
      # audits every committed manifest version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify version matches tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          # MAJOR.MINOR.PATCH is a regular release and
          # MAJOR.MINOR.PATCH-beta.N a beta, N counting from 1 (DR-087);
          # no number carries a leading zero (SemVer).
          FORM='^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-beta\.([1-9][0-9]*))?$'
          if [[ "$TAG_VERSION" =~ $FORM ]]; then
            BASE="${BASH_REMATCH[1]}"
            N="${BASH_REMATCH[6]}"
          else
            echo "::error::Tag $GITHUB_REF_NAME is neither app-vMAJOR.MINOR.PATCH nor app-vMAJOR.MINOR.PATCH-beta.N (N from 1, no leading zeros); no other pre-release identifier or build metadata is accepted."
            exit 1
          fi
          if [ -n "$N" ]; then BETA=true; else BETA=false; fi
          # Both manifests carry the tag's version verbatim, a beta's
          # included.
          for pkg in apps/desktop apps/server; do
            PKG_VERSION="$(node -p "require('./$pkg/package.json').version")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $TAG_VERSION does not match $pkg/package.json $PKG_VERSION"
              exit 1
            fi
          done
          {
            echo "version=$TAG_VERSION"
            echo "beta=$BETA"
            echo "base=$BASE"
            echo "n=$N"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - name: Tests
        run: npm test

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
          BASE: ${{ steps.version.outputs.base }}
          N: ${{ steps.version.outputs.n }}
        run: |
          # A regular release's notes are its version's section of the
          # app changelog; a beta's are the [Unreleased] section as it
          # stands at the tag, under a line naming the beta, since the
          # changelog keeps no section for a beta (DR-087). Then the way
          # to run this release from source.
          if [ "$BETA" = true ]; then
            SECTION=Unreleased
          else
            SECTION="$VERSION"
          fi
          # The last section runs to the file's end, where the link
          # definitions live; those lines are not notes.
          sed -n "/^## \[${SECTION}\]/,/^## \[/{/^## \[${SECTION}\]/d;/^## \[/d;p}" CHANGELOG.md \
            | grep -v -E '^\[[^]]+\]: ' > /tmp/changelog-section.md || true
          # Blank lines and headings alone are no notes: a section left
          # empty by the last release still holds a blank line.
          if ! grep -q -v -E '^(#.*|[[:space:]]*)$' /tmp/changelog-section.md; then
            echo "::error::No release notes found under [${SECTION}] in CHANGELOG.md for ${GITHUB_REF_NAME}"
            exit 1
          fi
          : > /tmp/release-notes.md
          if [ "$BETA" = true ]; then
            cat >> /tmp/release-notes.md <<EOF
          Beta ${N} on the way to ${BASE} — everything unreleased at this tag.

          EOF
          fi
          cat /tmp/changelog-section.md >> /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<EOF

          ## Run from source

          This release ships no binaries: build it on macOS or Linux with Node.js 22 or later and a native build toolchain. Storage requires private POSIX permissions. Windows users can run the scaffold CLI or access a Spex server in their browser.

          \`\`\`bash
          git clone https://github.com/${GITHUB_REPOSITORY}.git
          cd spex
          git checkout ${GITHUB_REF_NAME}
          npm ci
          npm start              # the desktop app
          npm run start:server   # the server shell: prints http://127.0.0.1:8137/?token=…
          \`\`\`

          Agent sign-in, GitHub, and playbook-compile prerequisites are in the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md).
          EOF
          if [ "$BETA" = true ]; then
            cat >> /tmp/release-notes.md <<EOF

          This beta ran CI, the smoke and the live smoke; the regression and the manual checklist run before the regular release ([DR-087](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/specs/decisions/087-beta-app-releases.md)).
          EOF
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Spex App v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.version.outputs.beta == 'true' }}
