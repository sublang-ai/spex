name: App Release

# The app channel (DR-040): an app-v* tag releases the desktop and
# server shells as source — a GitHub release carrying the changelog
# notes and the run-from-source instructions, no build artifacts.
# A beta (DR-087) is tagged app-vMAJOR.MINOR.PATCH-beta.N and released
# as a pre-release whose notes are the changelog's [Unreleased] section
# at the tag; a tag with any other pre-release identifier or build
# metadata is refused.

on:
  push:
    tags:
      - "app-v*"

permissions: {}

env:
  # Nothing here launches Electron: the release is source only.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  require-ci-green:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require CI to be green for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI (ci.yml) to succeed for commit $SHA"
          for attempt in $(seq 1 60); do
            line="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '(.workflow_runs[0].status // "missing") + " " + (.workflow_runs[0].conclusion // "none")')"
            status="${line%% *}"
            conclusion="${line##* }"
            echo "attempt $attempt/60: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green for $SHA."
                exit 0
              fi
              echo "::error::CI for $SHA concluded '$conclusion'; refusing to release."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI to complete for $SHA; refusing to release."
          exit 1

  release:
    needs: require-ci-green
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history: the CLI's file-history guard, part of npm test,
      # audits every committed manifest version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tag's form and both manifests' versions (release-19,
      # release-27): scripts/release-notes.mjs, tested by
      # release-notes.test.mjs (release-28). Built-ins only, before
      # npm ci.
      - name: Verify version matches tag
        id: version
        run: node scripts/release-notes.mjs check --tag="$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run build

      - name: Tests
        run: npm test

      # A regular release's notes are its version's section of the app
      # changelog; a beta's are [Unreleased] as it stands at the tag,
      # under a line naming the beta (DR-087). Then the way to run this
      # release from source, and for a beta the gates it skipped.
      - name: Extract release notes
        run: >-
          node scripts/release-notes.mjs notes
          --tag="$GITHUB_REF_NAME"
          --repository="$GITHUB_REPOSITORY"
          --out=/tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.title }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.version.outputs.beta == 'true' }}
