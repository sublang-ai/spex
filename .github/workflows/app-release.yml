name: App Release

# App tags build native desktop downloads; publish only when both platforms pass.
on:
  push:
    tags:
      - "app-v*"

permissions: {}

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true
      channel: app

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      title: ${{ steps.version.outputs.title }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version matches tag
        id: version
        run: node scripts/release-notes.mjs check --tag="$GITHUB_REF_NAME"
      - name: Extract release notes
        run: >-
          node scripts/release-notes.mjs notes
          --tag="$GITHUB_REF_NAME"
          --repository="$GITHUB_REPOSITORY"
          --out=release-notes.md
      - name: Require published runtime dependencies
        run: node scripts/dependency-closure.mjs --registry-only
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-notes
          path: release-notes.md
          if-no-files-found: error

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            script: package:mac
            asset: mac-arm64.dmg
          - os: windows-2022
            script: package:windows
            asset: win-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build native desktop package
        run: npm run ${{ matrix.script }} -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: apps/desktop/release/Spex-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-check-${{ matrix.asset }}
          path: apps/desktop/release/compiler-check-*.json
          if-no-files-found: error

  release:
    needs: [validate, prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-notes
          path: notes
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Verify both downloads and write checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          test -s "Spex-$VERSION-mac-arm64.dmg"
          test -s "Spex-$VERSION-win-x64.exe"
          sha256sum "Spex-$VERSION-mac-arm64.dmg" "Spex-$VERSION-win-x64.exe" > SHA256SUMS
      - name: Create GitHub release with both native downloads
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.title }}
          body_path: notes/release-notes.md
          prerelease: ${{ needs.prepare.outputs.beta == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS
