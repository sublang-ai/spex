name: App Release

# App tags build native desktop downloads; publish only when both platforms pass.
on:
  push:
    tags:
      - "app-v*"

permissions: {}

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true
      release-tag: ${{ github.ref_name }}
      channel: app

  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      title: ${{ steps.version.outputs.title }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare version from tag
        id: version
        run: node scripts/release-version.mjs prepare --channel=app
      - name: Extract release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-notes.mjs notes
          --tag="$GITHUB_REF_NAME"
          --repository="$GITHUB_REPOSITORY"
          --out=release-notes.md
      - name: Require published runtime dependencies
        run: node scripts/dependency-closure.mjs --registry-only
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-notes
          path: release-notes.md
          if-no-files-found: error

  package:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            script: package:mac
            asset: mac-arm64.dmg
          - os: windows-2022
            script: package:windows
            asset: win-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare version from tag
        run: node scripts/release-version.mjs prepare --channel=app
      - run: npm ci
      - run: npm run build
      - name: Prepare private macOS signing inputs
        if: runner.os == 'macOS'
        shell: python
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          import base64, os
          from pathlib import Path
          names = ['MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD', 'APPLE_API_KEY_P8_BASE64', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER', 'APPLE_TEAM_ID']
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing macOS signing secret: ' + name)
          root = Path(os.environ['RUNNER_TEMP']) / 'spex-macos-secrets'
          root.mkdir(mode=0o700)
          outputs = {}
          for source, target, variable in [('MACOS_CERTIFICATE_P12_BASE64', 'signing.p12', 'CSC_LINK'), ('APPLE_API_KEY_P8_BASE64', 'notary.p8', 'APPLE_API_KEY')]:
              path = root / target
              with path.open('xb') as stream:
                  os.chmod(path, 0o600)
                  stream.write(base64.b64decode(os.environ[source], validate=True))
              outputs[variable] = str(path)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for name, value in outputs.items():
                  stream.write(name + '=' + value + '\n')
      - name: Build native desktop package
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }} -w apps/desktop
      - name: Build signed and notarized Mac package
        if: runner.os == 'macOS'
        run: npm run package:mac -w apps/desktop
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove private macOS signing inputs
        if: always() && runner.os == 'macOS'
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'spex-macos-secrets', ignore_errors=True)
      - name: Verify installer version matches tag
        run: node scripts/release-artifacts.mjs app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: apps/desktop/release/Spex-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-check-${{ matrix.asset }}
          path: apps/desktop/release/compiler-check-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-signing-verification
          path: |
            apps/desktop/release/macos-signing.json
            apps/desktop/release/macos-*-notarization.json
          if-no-files-found: error

  release:
    needs: [validate, prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-notes
          path: notes
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Verify both downloads and write checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          test -s "Spex-$VERSION-mac-arm64.dmg"
          test -s "Spex-$VERSION-win-x64.exe"
          sha256sum "Spex-$VERSION-mac-arm64.dmg" "Spex-$VERSION-win-x64.exe" > SHA256SUMS
      - name: Create GitHub release with both native downloads
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.title }}
          body_path: notes/release-notes.md
          prerelease: ${{ needs.prepare.outputs.beta == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS
