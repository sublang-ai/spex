# Spex / playbook shared configuration.
# This file is shared with the `playbook` CLI: both read and write the
# same schema, so anything configured here works in either host.
#
# Each agent — the captain and every player — carries its own inline
# settings: adapter, model, effort, permissions. Tuning one agent
# never changes another. The seeded lineup is single-vendor Claude so
# the first hour needs one sign-in; swap any block's adapter (e.g. to
# codex) once that vendor is signed in.

# captain: the Judge agent that routes Boss input and drives playbooks.
captain:
  adapter: claude
  model: claude-opus-4-8
  effort: high
  permissions:
    mode: auto        # protected auto mode for the Claude Captain

# notifications: off | bell | desktop per event (omitted -> off).
notifications:
  player_finished: bell
  turn_finished: desktop

# playbooks: enabled playbooks. Each key must equal the registry
# manifest id; `from` names the registry module; `players` maps the
# playbook's roles to agent blocks.
playbooks:
  code:
    from: "@sublang/playbook/code/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8[1m]
        effort: xhigh
        permissions:
          mode: auto        # protected auto mode for the Claude Coder
  review:
    from: "@sublang/playbook/review/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8
        effort: xhigh
        permissions:
          mode: auto
      reviewer:
        adapter: claude     # single-vendor default; a second vendor reads better
        model: claude-opus-4-8
        effort: xhigh
        permissions:
          mode: auto
      # Example second-vendor reviewer — replace the block above once
      # the Codex CLI is signed in:
      #   adapter: codex
      #   model: gpt-5.5
      #   effort: xhigh
      #   permissions:
      #     mode: auto
      #     writablePaths:
      #       - .git        # allow git metadata writes under Codex auto mode
  decide:
    from: "@sublang/playbook/decide/registry"
    players:
      coder:
        adapter: claude
        model: claude-opus-4-8
        effort: xhigh
        permissions:
          mode: auto
      reviewer:
        adapter: claude
        model: claude-opus-4-8
        effort: xhigh
        permissions:
          mode: auto
