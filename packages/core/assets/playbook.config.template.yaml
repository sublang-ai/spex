# Spex / playbook shared configuration.
# This file is shared with the `playbook` CLI: both read and write the
# same schema, so anything configured here works in either host.
#
# The captain and every session player carries its own inline
# settings: adapter, model, effort, permissions. A playbook's roles
# bind to players by name, and a binding may override only model or
# effort — the rest is the player's own. The seeded lineup is
# single-vendor Claude so the first hour needs one sign-in; swap any
# block's adapter (e.g. to codex) once that vendor is signed in.

# captain: the Judge agent that routes Boss input and drives playbooks.
captain:
  adapter: claude
  model: claude-opus-5
  effort: high
  permissions:
    mode: auto        # protected auto mode for the Claude Captain

# notifications: off | bell | desktop per event (omitted -> off).
notifications:
  player_finished: bell
  turn_finished: desktop

# Stable session players. Naming the same id from several role
# bindings deliberately shares one provider conversation across those
# playbooks — that is what makes a coder's context survive a handoff.
# Change an id to isolate its conversation instead.
players:
  dev.coder:
    adapter: claude
    model: claude-opus-5
    effort: xhigh
    permissions:
      mode: auto

  dev.reviewer:
    adapter: claude     # single-vendor default; a second vendor reads better
    model: claude-opus-5
    effort: xhigh
    permissions:
      mode: auto
    # To review with a second vendor instead:
    #   adapter: codex
    #   model: gpt-5.6-sol

# Enabled playbooks. Each is loaded from its explicit `from` module.
# Every manifest role is bound explicitly; these three deliberately
# reuse the same two players.
playbooks:
  code:
    from: "@sublang/playbook/code/registry"
    roles:
      coder: dev.coder

  review:
    from: "@sublang/playbook/review/registry"
    roles:
      coder: dev.coder
      reviewer: dev.reviewer

  decide:
    from: "@sublang/playbook/decide/registry"
    roles:
      coder: dev.coder
      reviewer: dev.reviewer
